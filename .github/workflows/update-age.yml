name: Update Age

on:
  schedule:
    # Every day at 05:35 AM IST
    - cron: "5 0 * * *"

  workflow_dispatch:

jobs:
  update-age:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ==========================================
      # CHECKOUT REPOSITORY
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================
      # INSTALL PILLOW
      # ==========================================

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pillow


      # ==========================================
      # UPDATE PROFILE + GENERATE TERMINAL CARD
      # ==========================================

      - name: Update profile and generate terminal card
        run: |
          python3 << 'PY'

          import json
          from datetime import date
          from PIL import (
              Image,
              ImageDraw,
              ImageFont,
              ImageFilter
          )


          # ==========================================
          # DATE CALCULATION
          # ==========================================

          DOB = date(2006, 9, 27)
          TODAY = date.today()

          years = TODAY.year - DOB.year

          if (TODAY.month, TODAY.day) < (DOB.month, DOB.day):
              years -= 1

          last_birthday = date(
              DOB.year + years,
              DOB.month,
              DOB.day
          )

          months = TODAY.month - last_birthday.month

          if TODAY.day < last_birthday.day:
              months -= 1

          if months < 0:
              months += 12

          if TODAY.day >= last_birthday.day:

              days = TODAY.day - last_birthday.day

          else:

              previous_month = TODAY.month - 1

              if previous_month == 0:
                  previous_month = 12
                  previous_year = TODAY.year - 1
              else:
                  previous_year = TODAY.year

              days = (
                  TODAY
                  - date(
                      previous_year,
                      previous_month,
                      last_birthday.day
                  )
              ).days

          age = f"{years} years, {months} months, {days} days"


          # ==========================================
          # UPDATE profile.json
          # ==========================================

          with open(
              "profile.json",
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          data["age"] = age


          with open(
              "profile.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  data,
                  file,
                  indent=2
              )

              file.write("\n")


          # ==========================================
          # PROFILE DATA
          # ==========================================

          name = data["name"]
          college = data["college"]
          degree = data["degree"]
          graduation = str(data["graduation"])


          # ==========================================
          # TERMINAL SETTINGS
          # ==========================================

          WIDTH = 900
          HEIGHT = 460

          BG = (13, 17, 23)

          WHITE = (240, 246, 252)

          MUTED = (139, 148, 158)

          GREEN = (63, 185, 80)


          # ==========================================
          # PHOTO SETTINGS
          # ==========================================

          PHOTO_X = 700
          PHOTO_Y = 78

          PHOTO_WIDTH = 230
          PHOTO_HEIGHT = 330


          # ==========================================
          # FONTS
          # ==========================================

          FONT_PATH = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSansMono.ttf"
          )

          BOLD_FONT_PATH = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSansMono-Bold.ttf"
          )

          FONT_SMALL = ImageFont.truetype(
              FONT_PATH,
              15
          )

          FONT_NORMAL = ImageFont.truetype(
              FONT_PATH,
              18
          )

          FONT_LARGE = ImageFont.truetype(
              BOLD_FONT_PATH,
              27
          )


          # ==========================================
          # TERMINAL CONTENT
          # ==========================================

          lines = [

              ("> whoami", "command"),

              (name, "name"),

              (
                  "COMPUTER SCIENCE / DEVELOPER / OPEN SOURCE",
                  "muted"
              ),

              ("> cat profile.json", "command"),

              ("{", "json"),

              (
                  f'  "age"        : "{age}"',
                  "json"
              ),

              (
                  f'  "college"    : "{college}"',
                  "json"
              ),

              (
                  f'  "degree"     : "{degree}"',
                  "json"
              ),

              (
                  f'  "graduation" : {graduation}',
                  "json"
              ),

              ("}", "json"),

              ("> status", "command"),

              ("[ ONLINE ]", "online"),

              ("> _", "command")
          ]


          # ==========================================
          # LOAD PROFILE PHOTO
          # ==========================================

          original_photo = Image.open(
              "profile-photo.jpg"
          ).convert("RGB")


          # ==========================================
          # RESIZE PHOTO
          # ==========================================

          original_photo.thumbnail(
              (
                  PHOTO_WIDTH,
                  PHOTO_HEIGHT
              ),
              Image.Resampling.LANCZOS
          )


          photo_base = Image.new(
              "RGB",
              (
                  PHOTO_WIDTH,
                  PHOTO_HEIGHT
              ),
              BG
          )


          offset_x = (
              PHOTO_WIDTH
              - original_photo.width
          ) // 2

          offset_y = (
              PHOTO_HEIGHT
              - original_photo.height
          ) // 2


          photo_base.paste(
              original_photo,
              (
                  offset_x,
                  offset_y
              )
          )


          # ==========================================
          # CONVERT PHOTO TO GRAYSCALE
          # ==========================================

          gray = photo_base.convert("L")


          # ==========================================
          # INCREASE CONTRAST
          # ==========================================

          gray = gray.point(
              lambda p: min(
                  255,
                  max(
                      0,
                      int(
                          (p - 128) * 1.35 + 128
                      )
                  )
              )
          )


          # ==========================================
          # GREEN TERMINAL COLOR
          # ==========================================

          dark_green = Image.new(
              "RGB",
              gray.size,
              (0, 45, 12)
          )

          bright_green = Image.new(
              "RGB",
              gray.size,
              (70, 220, 95)
          )


          photo = Image.composite(
              bright_green,
              dark_green,
              gray
          )


          # ==========================================
          # DARK OVERLAY
          # ==========================================

          photo = photo.convert("RGBA")


          dark_overlay = Image.new(
              "RGBA",
              photo.size,
              (0, 0, 0, 70)
          )


          photo.alpha_composite(
              dark_overlay
          )


          # ==========================================
          # TERMINAL SCANLINES
          # ==========================================

          scanlines = Image.new(
              "RGBA",
              photo.size,
              (0, 0, 0, 0)
          )

          scan_draw = ImageDraw.Draw(
              scanlines
          )


          for y in range(
              0,
              PHOTO_HEIGHT,
              4
          ):

              scan_draw.line(
                  (
                      0,
                      y,
                      PHOTO_WIDTH,
                      y
                  ),
                  fill=(0, 0, 0, 85),
                  width=1
              )


          photo.alpha_composite(
              scanlines
          )


          # ==========================================
          # SOFT TERMINAL GLOW
          # ==========================================

          glow = photo.filter(
              ImageFilter.GaussianBlur(
                  radius=2
              )
          )

          glow.putalpha(35)

          photo.alpha_composite(
              glow
          )


          # ==========================================
          # PHOTO REVEAL
          # ==========================================

          def create_photo_layer(
              reveal_progress
          ):

              layer = Image.new(
                  "RGBA",
                  (
                      PHOTO_WIDTH,
                      PHOTO_HEIGHT
                  ),
                  (
                      0,
                      0,
                      0,
                      0
                  )
              )


              reveal_height = int(
                  PHOTO_HEIGHT
                  * reveal_progress
              )


              if reveal_height <= 0:
                  return layer


              visible_photo = photo.crop(
                  (
                      0,
                      0,
                      PHOTO_WIDTH,
                      reveal_height
                  )
              )


              layer.alpha_composite(
                  visible_photo,
                  (
                      0,
                      0
                  )
              )


              return layer


          # ==========================================
          # FRAME RENDERER
          # ==========================================

          def create_frame(
              visible_text,
              photo_progress
          ):

              image = Image.new(
                  "RGBA",
                  (
                      WIDTH,
                      HEIGHT
                  ),
                  BG + (255,)
              )


              # ======================================
              # PHOTO
              # ======================================

              photo_layer = create_photo_layer(
                  photo_progress
              )


              # IMPORTANT:
              # Place the smaller photo layer
              # inside the larger terminal canvas.

              image.alpha_composite(
                  photo_layer,
                  (
                      PHOTO_X,
                      PHOTO_Y
                  )
              )


              # ======================================
              # TERMINAL HEADER
              # ======================================

              draw = ImageDraw.Draw(
                  image
              )


              draw.text(
                  (28, 20),
                  "CHINMAY_OS v1.0",
                  font=FONT_SMALL,
                  fill=MUTED
              )


              draw.text(
                  (
                      WIDTH // 2,
                      20
                  ),
                  "TERMINAL // PROFILE",
                  font=FONT_SMALL,
                  fill=MUTED,
                  anchor="ma"
              )


              draw.text(
                  (
                      WIDTH - 28,
                      20
                  ),
                  "ONLINE",
                  font=FONT_SMALL,
                  fill=GREEN,
                  anchor="ra"
              )


              # ======================================
              # TERMINAL TEXT
              # ======================================

              y = 72


              for index, (_, kind) in enumerate(lines):

                  if index >= len(visible_text):
                      break


                  current_text = visible_text[index]


                  if kind == "name":

                      font = FONT_LARGE
                      color = WHITE
                      spacing = 45


                  elif kind == "muted":

                      font = FONT_SMALL
                      color = MUTED
                      spacing = 31


                  elif kind == "command":

                      font = FONT_NORMAL
                      color = GREEN
                      spacing = 32


                  elif kind == "online":

                      font = FONT_NORMAL
                      color = GREEN
                      spacing = 32


                  else:

                      font = FONT_NORMAL
                      color = WHITE
                      spacing = 31


                  draw.text(
                      (
                          30,
                          y
                      ),
                      current_text,
                      font=font,
                      fill=color
                  )


                  y += spacing


              return image.convert("RGB")


          # ==========================================
          # ANIMATION SETTINGS
          # ==========================================

          frames = []

          FRAMES_PER_CHARACTER = 1

          NAME_INDEX = 1


          # ==========================================
          # INITIAL FRAME
          # ==========================================

          frames.append(
              create_frame(
                  [],
                  0.0
              )
          )


          # ==========================================
          # CALCULATE PHOTO REVEAL RANGE
          # ==========================================

          characters_after_name = sum(
              len(text)
              for index, (text, kind) in enumerate(lines)
              if index >= NAME_INDEX
          )


          photo_step = (
              1.0
              / max(
                  1,
                  characters_after_name
              )
          )


          photo_progress = 0.0


          # ==========================================
          # TYPE TEXT + REVEAL PHOTO
          # ==========================================

          for line_index, (
              text,
              kind
          ) in enumerate(lines):


              visible = [
                  lines[i][0]
                  for i in range(
                      line_index
                  )
              ]


              visible.append("")


              # --------------------------------------
              # TYPE CURRENT LINE
              # --------------------------------------

              for character_index in range(
                  1,
                  len(text) + 1
              ):

                  visible[-1] = text[
                      :character_index
                  ]


                  # ------------------------------------
                  # START PHOTO WHEN NAME STARTS
                  # ------------------------------------

                  if line_index >= NAME_INDEX:

                      photo_progress += photo_step

                      photo_progress = min(
                          1.0,
                          photo_progress
                      )


                  frame = create_frame(
                      visible.copy(),
                      photo_progress
                  )


                  frames.append(
                      frame
                  )


              # --------------------------------------
              # SMALL PAUSE AFTER EACH LINE
              # --------------------------------------

              finished_frame = create_frame(
                  visible.copy(),
                  photo_progress
              )


              for _ in range(2):

                  frames.append(
                      finished_frame
                  )


          # ==========================================
          # FINAL FRAME
          # ==========================================

          final_frame = create_frame(
              [
                  line[0]
                  for line in lines
              ],
              1.0
          )


          # ==========================================
          # HOLD FINAL STATE
          # ==========================================

          for _ in range(30):

              frames.append(
                  final_frame
              )


          # ==========================================
          # SAVE GIF
          # ==========================================

          frames[0].save(
              "profile-card.gif",
              save_all=True,
              append_images=frames[1:],
              duration=35,
              loop=0,
              optimize=True
          )


          # ==========================================
          # LOG
          # ==========================================

          print(
              f"Generated {len(frames)} frames."
          )

          print(
              f"Updated age: {age}"
          )

          print(
              "Terminal profile card generated successfully."
          )

          PY


      # ==========================================
      # COMMIT UPDATED PROFILE
      # ==========================================

      - name: Commit updated profile
        run: |

          git config user.name "Chinmay Bhat"

          git config user.email "chinmaybhat992@gmail.com"

          git add profile.json profile-card.gif

          git diff --cached --quiet || \
            git commit -m "Update profile"

          git push