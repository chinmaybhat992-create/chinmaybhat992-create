name: Update Age

on:
  schedule:
    # Every day at 05:35 AM IST
    - cron: "5 0 * * *"

  workflow_dispatch:

jobs:
  update-age:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pillow

      - name: Update profile and generate terminal card
        run: |
          python3 << 'PY'
          import json
          from datetime import date
          from PIL import (
              Image,
              ImageDraw,
              ImageFont,
              ImageEnhance,
              ImageOps,
              ImageFilter
          )


          # ==========================================
          # DATE CALCULATION
          # ==========================================

          DOB = date(2006, 9, 27)
          TODAY = date.today()

          years = TODAY.year - DOB.year

          if (TODAY.month, TODAY.day) < (DOB.month, DOB.day):
              years -= 1

          last_birthday = date(
              DOB.year + years,
              DOB.month,
              DOB.day
          )

          months = TODAY.month - last_birthday.month

          if TODAY.day < last_birthday.day:
              months -= 1

          if months < 0:
              months += 12

          if TODAY.day >= last_birthday.day:
              days = TODAY.day - last_birthday.day

          else:
              previous_month = TODAY.month - 1

              if previous_month == 0:
                  previous_month = 12
                  previous_year = TODAY.year - 1

              else:
                  previous_year = TODAY.year

              days = (
                  TODAY - date(
                      previous_year,
                      previous_month,
                      last_birthday.day
                  )
              ).days

          age = f"{years} years, {months} months, {days} days"


          # ==========================================
          # UPDATE profile.json
          # ==========================================

          with open("profile.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          data["age"] = age

          with open("profile.json", "w", encoding="utf-8") as file:
              json.dump(data, file, indent=2)
              file.write("\n")


          # ==========================================
          # PROFILE DATA
          # ==========================================

          name = data["name"]
          college = data["college"]
          degree = data["degree"]
          graduation = str(data["graduation"])


          # ==========================================
          # IMAGE SETTINGS
          # ==========================================

          WIDTH = 1000
          HEIGHT = 460

          BG = (13, 17, 23)

          WHITE = (240, 246, 252)

          MUTED = (139, 148, 158)

          GREEN = (63, 185, 80)


          # ==========================================
          # FONTS
          # ==========================================

          FONT_PATH = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSansMono.ttf"
          )

          BOLD_FONT_PATH = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSansMono-Bold.ttf"
          )

          FONT_SMALL = ImageFont.truetype(
              FONT_PATH,
              15
          )

          FONT_NORMAL = ImageFont.truetype(
              FONT_PATH,
              18
          )

          FONT_LARGE = ImageFont.truetype(
              BOLD_FONT_PATH,
              27
          )


          # ==========================================
          # PHOTO SETTINGS
          # ==========================================

          PHOTO_X = 755
          PHOTO_Y = 82
          PHOTO_W = 190
          PHOTO_H = 300


          # ==========================================
          # CREATE TERMINAL PHOTO
          # ==========================================

          def create_terminal_photo():

              photo = Image.open(
                  "profile-photo.jpg"
              ).convert("RGB")


              # --------------------------------------
              # Crop image to portrait
              # --------------------------------------

              photo_ratio = photo.width / photo.height
              target_ratio = PHOTO_W / PHOTO_H

              if photo_ratio > target_ratio:

                  new_width = int(
                      photo.height * target_ratio
                  )

                  left = (
                      photo.width - new_width
                  ) // 2

                  photo = photo.crop(
                      (
                          left,
                          0,
                          left + new_width,
                          photo.height
                      )
                  )

              else:

                  new_height = int(
                      photo.width / target_ratio
                  )

                  top = (
                      photo.height - new_height
                  ) // 2

                  photo = photo.crop(
                      (
                          0,
                          top,
                          photo.width,
                          top + new_height
                      )
                  )


              # --------------------------------------
              # Resize
              # --------------------------------------

              photo = photo.resize(
                  (PHOTO_W, PHOTO_H),
                  Image.Resampling.LANCZOS
              )


              # --------------------------------------
              # Monochrome
              # --------------------------------------

              gray = ImageOps.grayscale(photo)


              # --------------------------------------
              # Moderate contrast
              # --------------------------------------

              gray = ImageEnhance.Contrast(
                  gray
              ).enhance(1.25)


              # --------------------------------------
              # Dark green phosphor effect
              # --------------------------------------

              photo = ImageOps.colorize(
                  gray,
                  black=(2, 6, 3),
                  white=(48, 150, 62)
              )


              # --------------------------------------
              # Darken image slightly
              # --------------------------------------

              photo = ImageEnhance.Brightness(
                  photo
              ).enhance(0.78)


              # --------------------------------------
              # Subtle CRT scanlines
              # --------------------------------------

              draw = ImageDraw.Draw(photo)

              for y in range(
                  0,
                  PHOTO_H,
                  6
              ):

                  draw.line(
                      (
                          0,
                          y,
                          PHOTO_W,
                          y
                      ),
                      fill=(12, 45, 18),
                      width=1
                  )


              # --------------------------------------
              # Subtle terminal vignette
              # --------------------------------------

              vignette = Image.new(
                  "L",
                  (PHOTO_W, PHOTO_H),
                  0
              )

              vignette_draw = ImageDraw.Draw(
                  vignette
              )

              vignette_draw.rectangle(
                  (
                      0,
                      0,
                      PHOTO_W - 1,
                      PHOTO_H - 1
                  ),
                  outline=180,
                  width=18
              )

              # Correct Pillow GaussianBlur usage
              vignette = vignette.filter(
                  ImageFilter.GaussianBlur(
                      radius=10
                  )
              )


              # --------------------------------------
              # Dark overlay
              # --------------------------------------

              dark_overlay = Image.new(
                  "RGB",
                  (PHOTO_W, PHOTO_H),
                  (0, 0, 0)
              )


              photo = Image.composite(
                  dark_overlay,
                  photo,
                  vignette
              )


              return photo


          terminal_photo = create_terminal_photo()


          # ==========================================
          # TERMINAL CONTENT
          # ==========================================

          lines = [

              ("> whoami", "command"),

              (name, "name"),

              (
                  "COMPUTER SCIENCE / DEVELOPER / OPEN SOURCE",
                  "muted"
              ),

              ("> cat profile.json", "command"),

              ("{", "json"),

              (
                  f'  "age"        : "{age}"',
                  "json"
              ),

              (
                  f'  "college"    : "{college}"',
                  "json"
              ),

              (
                  f'  "degree"     : "{degree}"',
                  "json"
              ),

              (
                  f'  "graduation" : {graduation}',
                  "json"
              ),

              ("}", "json"),

              ("> status", "command"),

              ("[ ONLINE ]", "online"),

              ("> _", "command")
          ]


          # ==========================================
          # FRAME RENDERER
          # ==========================================

          def create_frame(
              visible_text,
              photo_height=0
          ):

              image = Image.new(
                  "RGB",
                  (WIDTH, HEIGHT),
                  BG
              )

              draw = ImageDraw.Draw(image)


              # ======================================
              # TERMINAL HEADER
              # ======================================

              draw.text(
                  (28, 20),
                  "CHINMAY_OS v1.0",
                  font=FONT_SMALL,
                  fill=MUTED
              )

              draw.text(
                  (WIDTH // 2, 20),
                  "TERMINAL // PROFILE",
                  font=FONT_SMALL,
                  fill=MUTED,
                  anchor="ma"
              )

              draw.text(
                  (WIDTH - 28, 20),
                  "ONLINE",
                  font=FONT_SMALL,
                  fill=GREEN,
                  anchor="ra"
              )


              # ======================================
              # TERMINAL CONTENT
              # ======================================

              y = 72

              for index, (_, kind) in enumerate(lines):

                  if index >= len(visible_text):
                      break

                  current_text = visible_text[index]


                  if kind == "name":

                      font = FONT_LARGE
                      color = WHITE
                      spacing = 45

                  elif kind == "muted":

                      font = FONT_SMALL
                      color = MUTED
                      spacing = 31

                  elif kind == "command":

                      font = FONT_NORMAL
                      color = GREEN
                      spacing = 32

                  elif kind == "online":

                      font = FONT_NORMAL
                      color = GREEN
                      spacing = 32

                  else:

                      font = FONT_NORMAL
                      color = WHITE
                      spacing = 31


                  draw.text(
                      (30, y),
                      current_text,
                      font=font,
                      fill=color
                  )

                  y += spacing


              # ======================================
              # TERMINAL PHOTO
              # ======================================

              if photo_height > 0:

                  visible_height = min(
                      photo_height,
                      PHOTO_H
                  )

                  photo_part = terminal_photo.crop(
                      (
                          0,
                          0,
                          PHOTO_W,
                          visible_height
                      )
                  )


                  # ----------------------------------
                  # Terminal-style frame
                  # ----------------------------------

                  draw.rectangle(
                      (
                          PHOTO_X - 4,
                          PHOTO_Y - 4,
                          PHOTO_X + PHOTO_W + 4,
                          PHOTO_Y + PHOTO_H + 4
                      ),
                      outline=(45, 100, 55),
                      width=1
                  )


                  # ----------------------------------
                  # Photo reveal
                  # ----------------------------------

                  image.paste(
                      photo_part,
                      (
                          PHOTO_X,
                          PHOTO_Y
                      )
                  )


              return image


          # ==========================================
          # GENERATE ONE-SHOT TYPING ANIMATION
          # ==========================================

          frames = []

          FRAMES_PER_CHARACTER = 1


          # ==========================================
          # INITIAL FRAME
          # ==========================================

          frames.append(
              create_frame([])
          )


          # ==========================================
          # TYPE FROM TOP TO BOTTOM
          # ==========================================

          for line_index, (text, kind) in enumerate(lines):

              visible = [
                  lines[i][0]
                  for i in range(line_index)
              ]

              visible.append("")


              # --------------------------------------
              # Type one character at a time
              # --------------------------------------

              for character_index in range(
                  1,
                  len(text) + 1
              ):

                  visible[-1] = text[
                      :character_index
                  ]

                  frame = create_frame(
                      visible.copy()
                  )

                  frames.append(frame)


              # --------------------------------------
              # Small pause after completed line
              # --------------------------------------

              finished_frame = create_frame(
                  visible.copy()
              )

              for _ in range(2):

                  frames.append(
                      finished_frame
                  )


          # ==========================================
          # PHOTO REVEAL
          # ==========================================

          completed_text = [
              line[0]
              for line in lines
          ]


          # Reveal photo from TOP → BOTTOM
          for height in range(
              0,
              PHOTO_H + 1,
              10
          ):

              frame = create_frame(
                  completed_text,
                  height
              )

              frames.append(frame)


          # ==========================================
          # FINAL FRAME
          # ==========================================

          final_frame = create_frame(
              completed_text,
              PHOTO_H
          )


          # Hold the final completed state
          for _ in range(35):

              frames.append(
                  final_frame
              )


          # ==========================================
          # SAVE GIF
          # ==========================================

          frames[0].save(
              "profile-card.gif",
              save_all=True,
              append_images=frames[1:],
              duration=35,
              optimize=True
          )

          PY


      # ==========================================
      # COMMIT UPDATED PROFILE
      # ==========================================

      - name: Commit updated profile
        run: |
          git config user.name "Chinmay Bhat"
          git config user.email "chinmaybhat992@gmail.com"

          git add profile.json profile-card.gif

          git diff --cached --quiet || git commit -m "Refine terminal photo styling"

          git push