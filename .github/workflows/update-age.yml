name: Update Age

on:
  schedule:
    # Every day at 05:35 AM IST
    - cron: "5 0 * * *"

  workflow_dispatch:

jobs:
  update-age:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update profile and generate card
        run: |
          python3 << 'PY'
          import json
          from datetime import date
          from xml.sax.saxutils import escape

          # ==========================================
          # DATE CALCULATION
          # ==========================================

          DOB = date(2006, 9, 27)
          TODAY = date.today()

          years = TODAY.year - DOB.year

          if (TODAY.month, TODAY.day) < (DOB.month, DOB.day):
              years -= 1

          last_birthday = date(
              DOB.year + years,
              DOB.month,
              DOB.day
          )

          months = TODAY.month - last_birthday.month

          if TODAY.day < last_birthday.day:
              months -= 1

          if months < 0:
              months += 12

          if TODAY.day >= last_birthday.day:
              days = TODAY.day - last_birthday.day
          else:
              previous_month = TODAY.month - 1

              if previous_month == 0:
                  previous_month = 12
                  previous_year = TODAY.year - 1
              else:
                  previous_year = TODAY.year

              days = (
                  TODAY - date(
                      previous_year,
                      previous_month,
                      last_birthday.day
                  )
              ).days

          age = f"{years} years, {months} months, {days} days"


          # ==========================================
          # UPDATE profile.json
          # ==========================================

          with open("profile.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          data["age"] = age

          with open("profile.json", "w", encoding="utf-8") as file:
              json.dump(data, file, indent=2)
              file.write("\n")


          # ==========================================
          # ESCAPE DATA FOR SVG
          # ==========================================

          name = escape(data["name"])
          age = escape(data["age"])
          college = escape(data["college"])
          degree = escape(data["degree"])
          graduation = escape(str(data["graduation"]))


          # ==========================================
          # SVG HELPERS
          # ==========================================

          FONT = "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"

          GREEN = "#39ff14"
          DIM_GREEN = "#20a80f"

          def clip_id(index):
              return f"clip{index}"


          def animated_text(
              index,
              x,
              y,
              text,
              font_size=16,
              weight="normal",
              duration="0.8s",
              begin="0s",
              width=820,
              color=GREEN
          ):
              """
              Creates a left-to-right typing/reveal animation.
              The line becomes visible progressively, then resets
              when the whole animation loops.
              """

              return f'''
              <clipPath id="{clip_id(index)}">
                <rect
                  x="{x}"
                  y="{y - font_size}"
                  width="0"
                  height="{font_size + 10}">

                  <animate
                    attributeName="width"
                    from="0"
                    to="{width}"
                    begin="{begin}"
                    dur="{duration}"
                    fill="freeze"
                    repeatCount="indefinite"/>

                </rect>
              </clipPath>

              <text
                x="{x}"
                y="{y}"
                font-family="{FONT}"
                font-size="{font_size}"
                font-weight="{weight}"
                fill="{color}"
                clip-path="url(#{clip_id(index)})"
                filter="url(#glow)">

                {text}

              </text>
              '''


          # ==========================================
          # ANIMATION TIMELINE
          # ==========================================

          # The entire sequence takes about 14 seconds.
          #
          # 0.0  header
          # 0.8  whoami
          # 1.5  name
          # 2.4  subtitle
          # 3.5  cat command
          # 4.2  JSON opening
          # 4.8  age
          # 5.5  college
          # 6.4  degree
          # 7.2  graduation
          # 8.0  closing brace
          # 9.0  status
          # 9.7  online
          # 10.5 cursor
          #
          # Then the sequence restarts.


          header_left = animated_text(
              1, 28, 32,
              "CHINMAY_OS v1.0",
              font_size=15,
              begin="0s",
              duration="0.7s",
              width=210
          )

          header_center = animated_text(
              2, 450, 32,
              "TERMINAL // PROFILE",
              font_size=15,
              begin="0.2s",
              duration="0.8s",
              width=220
          )

          header_right = animated_text(
              3, 872, 32,
              "ONLINE",
              font_size=15,
              begin="0.4s",
              duration="0.5s",
              width=80
          )


          whoami = animated_text(
              4, 30, 78,
              "&gt; whoami",
              font_size=18,
              begin="0.8s",
              duration="0.65s",
              width=160
          )


          name_line = animated_text(
              5, 30, 112,
              name,
              font_size=27,
              weight="bold",
              begin="1.5s",
              duration="1.0s",
              width=350
          )


          subtitle = animated_text(
              6, 30, 140,
              "COMPUTER SCIENCE / DEVELOPER / OPEN SOURCE",
              font_size=15,
              begin="2.4s",
              duration="1.0s",
              width=500,
              color=DIM_GREEN
          )


          cat_command = animated_text(
              7, 30, 174,
              "&gt; cat profile.json",
              font_size=18,
              begin="3.5s",
              duration="0.8s",
              width=250
          )


          opening_brace = animated_text(
              8, 50, 218,
              "&#123;",
              font_size=18,
              begin="4.2s",
              duration="0.3s",
              width=30
          )


          age_line = animated_text(
              9, 75, 248,
              f'"age"        : "{age}"',
              font_size=17,
              begin="4.8s",
              duration="1.0s",
              width=600
          )


          college_line = animated_text(
              10, 75, 278,
              f'"college"    : "{college}"',
              font_size=17,
              begin="5.5s",
              duration="1.1s",
              width=760
          )


          degree_line = animated_text(
              11, 75, 308,
              f'"degree"     : "{degree}"',
              font_size=17,
              begin="6.4s",
              duration="0.9s",
              width=500
          )


          graduation_line = animated_text(
              12, 75, 338,
              f'"graduation" : {graduation}',
              font_size=17,
              begin="7.2s",
              duration="0.8s",
              width=300
          )


          closing_brace = animated_text(
              13, 50, 368,
              "&#125;",
              font_size=18,
              begin="8.0s",
              duration="0.3s",
              width=30
          )


          status_command = animated_text(
              14, 30, 402,
              "&gt; status",
              font_size=18,
              begin="9.0s",
              duration="0.6s",
              width=150
          )


          online_status = animated_text(
              15, 155, 402,
              "[ ONLINE ]",
              font_size=18,
              begin="9.7s",
              duration="0.7s",
              width=170
          )


          cursor = animated_text(
              16, 30, 430,
              "&gt; _",
              font_size=18,
              begin="10.5s",
              duration="0.3s",
              width=50
          )


          # ==========================================
          # GENERATE SVG
          # ==========================================

          svg = f'''<svg
            width="900"
            height="455"
            viewBox="0 0 900 455"
            xmlns="http://www.w3.org/2000/svg">

            <defs>

              <!-- CRT scanlines -->

              <pattern
                id="scanlines"
                width="4"
                height="4"
                patternUnits="userSpaceOnUse">

                <rect
                  width="4"
                  height="2"
                  fill="{GREEN}"
                  opacity="0.035"/>

              </pattern>


              <!-- Phosphor glow -->

              <filter
                id="glow"
                x="-30%"
                y="-30%"
                width="160%"
                height="160%">

                <feGaussianBlur
                  stdDeviation="2"
                  result="blur"/>

                <feMerge>

                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>

                </feMerge>

              </filter>


              <!-- CRT vignette -->

              <radialGradient id="vignette">

                <stop
                  offset="0%"
                  stop-color="#061006"
                  stop-opacity="0"/>

                <stop
                  offset="70%"
                  stop-color="#020502"
                  stop-opacity="0.08"/>

                <stop
                  offset="100%"
                  stop-color="#000000"
                  stop-opacity="0.7"/>

              </radialGradient>

            </defs>


            <!-- ====================================== -->
            <!-- SCREEN -->
            <!-- ====================================== -->

            <rect
              x="1"
              y="1"
              width="898"
              height="453"
              fill="#020402"
              stroke="{GREEN}"
              stroke-width="1.5"/>


            <!-- Scanlines -->

            <rect
              x="1"
              y="1"
              width="898"
              height="453"
              fill="url(#scanlines)"/>


            <!-- Vignette -->

            <rect
              x="1"
              y="1"
              width="898"
              height="453"
              fill="url(#vignette)"/>


            <!-- ====================================== -->
            <!-- HEADER -->
            <!-- ====================================== -->

            {header_left}

            {header_center}

            {header_right}


            <line
              x1="20"
              y1="50"
              x2="880"
              y2="50"
              stroke="{GREEN}"
              stroke-width="1"
              opacity="0.75"/>


            <!-- ====================================== -->
            <!-- WHOAMI -->
            <!-- ====================================== -->

            {whoami}

            {name_line}

            {subtitle}


            <!-- ====================================== -->
            <!-- PROFILE COMMAND -->
            <!-- ====================================== -->

            {cat_command}


            <!-- JSON BORDER -->

            <rect
              x="28"
              y="190"
              width="844"
              height="190"
              fill="none"
              stroke="{DIM_GREEN}"
              stroke-width="1"
              opacity="0.65"/>


            <!-- JSON -->

            {opening_brace}

            {age_line}

            {college_line}

            {degree_line}

            {graduation_line}

            {closing_brace}


            <!-- ====================================== -->
            <!-- STATUS -->
            <!-- ====================================== -->

            {status_command}

            {online_status}

            {cursor}

          </svg>'''


          # ==========================================
          # SAVE SVG
          # ==========================================

          with open("profile-card.svg", "w", encoding="utf-8") as file:
              file.write(svg)

          PY


      - name: Commit updated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile.json profile-card.svg

          git diff --cached --quiet || git commit -m "Update profile"

          git push