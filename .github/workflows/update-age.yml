name: Update Age

on:
  schedule:
    # Every day at 05:35 AM IST
    - cron: "5 0 * * *"

  workflow_dispatch:

jobs:
  update-age:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update profile and generate card
        run: |
          python3 << 'PY'
          import json
          from datetime import date
          from xml.sax.saxutils import escape

          # ==========================================
          # DATE CALCULATION
          # ==========================================

          DOB = date(2006, 9, 27)
          TODAY = date.today()

          years = TODAY.year - DOB.year

          if (TODAY.month, TODAY.day) < (DOB.month, DOB.day):
              years -= 1

          last_birthday = date(
              DOB.year + years,
              DOB.month,
              DOB.day
          )

          months = TODAY.month - last_birthday.month

          if TODAY.day < last_birthday.day:
              months -= 1

          if months < 0:
              months += 12

          if TODAY.day >= last_birthday.day:
              days = TODAY.day - last_birthday.day
          else:
              previous_month = TODAY.month - 1

              if previous_month == 0:
                  previous_month = 12
                  previous_year = TODAY.year - 1
              else:
                  previous_year = TODAY.year

              days = (
                  TODAY - date(
                      previous_year,
                      previous_month,
                      last_birthday.day
                  )
              ).days

          age = f"{years} years, {months} months, {days} days"


          # ==========================================
          # UPDATE profile.json
          # ==========================================

          with open("profile.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          data["age"] = age

          with open("profile.json", "w", encoding="utf-8") as file:
              json.dump(data, file, indent=2)
              file.write("\n")


          # ==========================================
          # ESCAPE DATA FOR SVG
          # ==========================================

          name = escape(data["name"])
          age = escape(data["age"])
          college = escape(data["college"])
          degree = escape(data["degree"])
          graduation = escape(str(data["graduation"]))


          # ==========================================
          # GENERATE PROFILE CARD
          # ==========================================

          svg = f'''<svg
            width="900"
            height="390"
            viewBox="0 0 900 390"
            xmlns="http://www.w3.org/2000/svg">

            <defs>

              <!-- Background -->
              <linearGradient
                id="background"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

                <stop offset="0%" stop-color="#0d1117"/>
                <stop offset="100%" stop-color="#151b23"/>

              </linearGradient>

              <!-- Accent -->
              <linearGradient
                id="accent"
                x1="0"
                y1="0"
                x2="1"
                y2="0">

                <stop offset="0%" stop-color="#7c3aed"/>
                <stop offset="100%" stop-color="#3b82f6"/>

              </linearGradient>

            </defs>


            <!-- CARD -->

            <rect
              x="1"
              y="1"
              width="898"
              height="388"
              rx="20"
              fill="url(#background)"
              stroke="#30363d"
              stroke-width="2"/>


            <!-- LEFT ACCENT -->

            <rect
              x="0"
              y="0"
              width="6"
              height="390"
              rx="3"
              fill="url(#accent)"/>


            <!-- TERMINAL HEADER -->

            <circle
              cx="32"
              cy="30"
              r="6"
              fill="#ff5f56"/>

            <circle
              cx="54"
              cy="30"
              r="6"
              fill="#ffbd2e"/>

            <circle
              cx="76"
              cy="30"
              r="6"
              fill="#27c93f"/>


            <text
              x="450"
              y="35"
              text-anchor="middle"
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
              font-size="13"
              fill="#8b949e">

              chinmay.json

            </text>


            <!-- TERMINAL COMMAND -->

            <text
              x="45"
              y="82"
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
              font-size="14"
              fill="#8b949e">

              &gt; profile --info

            </text>


            <!-- NAME -->

            <text
              x="45"
              y="122"
              font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
              font-size="30"
              font-weight="700"
              fill="#f0f6fc">

              {name}

            </text>


            <!-- SUBTITLE -->

            <text
              x="45"
              y="149"
              font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
              font-size="14"
              fill="#8b949e">

              Computer Science  •  Developer  •  Open Source

            </text>


            <!-- DIVIDER -->

            <line
              x1="45"
              y1="174"
              x2="855"
              y2="174"
              stroke="#30363d"
              stroke-width="1"/>


            <!-- AGE LABEL -->

            <text
              x="45"
              y="207"
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
              font-size="12"
              fill="#8b949e">

              age

            </text>


            <!-- AGE VALUE -->

            <text
              x="45"
              y="231"
              font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
              font-size="16"
              fill="#f0f6fc">

              {age}

            </text>


            <!-- COLLEGE LABEL -->

            <text
              x="45"
              y="263"
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
              font-size="12"
              fill="#8b949e">

              college

            </text>


            <!-- COLLEGE VALUE -->

            <text
              x="45"
              y="287"
              font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
              font-size="16"
              fill="#f0f6fc">

              {college}

            </text>


            <!-- DEGREE LABEL -->

            <text
              x="500"
              y="207"
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
              font-size="12"
              fill="#8b949e">

              degree

            </text>


            <!-- DEGREE VALUE -->

            <text
              x="500"
              y="231"
              font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
              font-size="16"
              fill="#f0f6fc">

              {degree}

            </text>


            <!-- GRADUATION LABEL -->

            <text
              x="500"
              y="263"
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
              font-size="12"
              fill="#8b949e">

              graduation

            </text>


            <!-- GRADUATION VALUE -->

            <text
              x="500"
              y="287"
              font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
              font-size="16"
              fill="#f0f6fc">

              {graduation}

            </text>


            <!-- BOTTOM DIVIDER -->

            <line
              x1="45"
              y1="320"
              x2="855"
              y2="320"
              stroke="#30363d"
              stroke-width="1"/>


            <!-- FOOTER -->

            <text
              x="45"
              y="347"
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
              font-size="12"
              fill="#8b949e">

              ~/profile.json

            </text>


            <circle
              cx="818"
              cy="343"
              r="5"
              fill="#27c93f"/>


            <text
              x="830"
              y="347"
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
              font-size="12"
              fill="#8b949e">

              online

            </text>

          </svg>'''


          # ==========================================
          # SAVE SVG
          # ==========================================

          with open("profile-card.svg", "w", encoding="utf-8") as file:
              file.write(svg)

          PY


      - name: Commit updated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile.json profile-card.svg

          git diff --cached --quiet || git commit -m "Update profile"

          git push