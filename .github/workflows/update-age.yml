name: Update Age

on:
  schedule:
    # Every day at 05:35 AM IST
    - cron: "5 0 * * *"

  workflow_dispatch:

jobs:
  update-age:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================
      # INSTALL PILLOW
      # ==========================================

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pillow


      # ==========================================
      # UPDATE PROFILE + GENERATE TERMINAL CARD
      # ==========================================

      - name: Update profile and generate terminal card
        run: |

          python3 << 'PY'

          import json
          from datetime import date
          from PIL import Image, ImageDraw, ImageFont, ImageEnhance


          # ==========================================
          # DATE CALCULATION
          # ==========================================

          DOB = date(2006, 9, 27)
          TODAY = date.today()

          years = TODAY.year - DOB.year

          if (TODAY.month, TODAY.day) < (DOB.month, DOB.day):
              years -= 1

          last_birthday = date(
              DOB.year + years,
              DOB.month,
              DOB.day
          )

          months = TODAY.month - last_birthday.month

          if TODAY.day < last_birthday.day:
              months -= 1

          if months < 0:
              months += 12

          if TODAY.day >= last_birthday.day:

              days = TODAY.day - last_birthday.day

          else:

              previous_month = TODAY.month - 1

              if previous_month == 0:
                  previous_month = 12
                  previous_year = TODAY.year - 1

              else:
                  previous_year = TODAY.year

              days = (
                  TODAY -
                  date(
                      previous_year,
                      previous_month,
                      last_birthday.day
                  )
              ).days

          age = f"{years} years, {months} months, {days} days"


          # ==========================================
          # UPDATE profile.json
          # ==========================================

          with open(
              "profile.json",
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          data["age"] = age


          with open(
              "profile.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  data,
                  file,
                  indent=2
              )

              file.write("\n")


          # ==========================================
          # PROFILE DATA
          # ==========================================

          name = data["name"]
          college = data["college"]
          degree = data["degree"]
          graduation = str(data["graduation"])


          # ==========================================
          # CANVAS
          # ==========================================

          WIDTH = 900
          HEIGHT = 460

          BG = (13, 17, 23)

          WHITE = (240, 246, 252)

          MUTED = (139, 148, 158)

          GREEN = (63, 185, 80)


          # ==========================================
          # LAYOUT
          # ==========================================

          # Left side is reserved for terminal text.
          TEXT_X = 30

          # Maximum width of text column.
          TEXT_RIGHT = 665

          # Right-side photo area.
          PHOTO_X = 700
          PHOTO_Y = 105

          PHOTO_WIDTH = 165
          PHOTO_HEIGHT = 270


          # ==========================================
          # FONTS
          # ==========================================

          FONT_PATH = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSansMono.ttf"
          )

          BOLD_FONT_PATH = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSansMono-Bold.ttf"
          )


          FONT_SMALL = ImageFont.truetype(
              FONT_PATH,
              15
          )

          FONT_NORMAL = ImageFont.truetype(
              FONT_PATH,
              18
          )

          FONT_LARGE = ImageFont.truetype(
              BOLD_FONT_PATH,
              27
          )


          # ==========================================
          # TERMINAL CONTENT
          # ==========================================

          lines = [

              ("> whoami", "command"),

              (name, "name"),

              (
                  "COMPUTER SCIENCE / DEVELOPER / OPEN SOURCE",
                  "muted"
              ),

              ("> cat profile.json", "command"),

              ("{", "json"),

              (
                  f'  "age"        : "{age}"',
                  "json"
              ),

              (
                  f'  "college"    : "{college}"',
                  "json"
              ),

              (
                  f'  "degree"     : "{degree}"',
                  "json"
              ),

              (
                  f'  "graduation" : {graduation}',
                  "json"
              ),

              ("}", "json"),

              ("> status", "command"),

              ("[ ONLINE ]", "online"),

              ("> _", "command")
          ]


          # ==========================================
          # PREPARE PHOTO
          # ==========================================

          original_photo = Image.open(
              "profile-photo.jpg"
          ).convert("RGB")


          # Resize while keeping the photo proportional.
          original_photo.thumbnail(
              (
                  PHOTO_WIDTH,
                  PHOTO_HEIGHT
              ),
              Image.Resampling.LANCZOS
          )


          # Create a dark canvas for the photo.
          photo_canvas = Image.new(
              "RGB",
              (
                  PHOTO_WIDTH,
                  PHOTO_HEIGHT
              ),
              BG
          )


          # Center the resized photo.
          photo_x = (
              PHOTO_WIDTH -
              original_photo.width
          ) // 2

          photo_y = (
              PHOTO_HEIGHT -
              original_photo.height
          ) // 2


          photo_canvas.paste(
              original_photo,
              (
                  photo_x,
                  photo_y
              )
          )


          # ==========================================
          # TERMINAL PHOTO EFFECT
          # ==========================================

          # Convert to grayscale.
          photo_gray = photo_canvas.convert(
              "L"
          )


          # Increase contrast.
          photo_gray = ImageEnhance.Contrast(
              photo_gray
          ).enhance(1.5)


          # Convert grayscale into green terminal tones.
          photo_terminal = Image.new(
              "RGB",
              photo_gray.size,
              BG
          )


          pixels = photo_gray.load()
          output = photo_terminal.load()


          for y in range(
              photo_gray.height
          ):

              for x in range(
                  photo_gray.width
              ):

                  value = pixels[x, y]

                  # Green monochrome terminal palette.
                  green_value = int(
                      value * 0.75
                  )

                  output[x, y] = (
                      10,
                      green_value,
                      30 + int(
                          value * 0.15
                      )
                  )


          # ==========================================
          # SCANLINES
          # ==========================================

          draw_photo = ImageDraw.Draw(
              photo_terminal
          )


          for y in range(
              0,
              PHOTO_HEIGHT,
              4
          ):

              draw_photo.line(
                  (
                      0,
                      y,
                      PHOTO_WIDTH,
                      y
                  ),
                  fill=(5, 35, 15),
                  width=1
              )


          # ==========================================
          # PHOTO BORDER
          # ==========================================

          draw_photo.rectangle(
              (
                  0,
                  0,
                  PHOTO_WIDTH - 1,
                  PHOTO_HEIGHT - 1
              ),
              outline=(30, 110, 45),
              width=1
          )


          # ==========================================
          # PHOTO REVEAL
          # ==========================================

          def add_photo(
              image,
              reveal_progress
          ):

              if reveal_progress <= 0:
                  return image

              reveal_progress = max(
                  0,
                  min(
                      1,
                      reveal_progress
                  )
              )

              visible_width = int(
                  PHOTO_WIDTH *
                  reveal_progress
              )

              if visible_width <= 0:
                  return image

              # Create a clean cropped section.
              visible_photo = photo_terminal.crop(
                  (
                      0,
                      0,
                      visible_width,
                      PHOTO_HEIGHT
                  )
              )

              image.paste(
                  visible_photo,
                  (
                      PHOTO_X,
                      PHOTO_Y
                  )
              )

              return image


          # ==========================================
          # FRAME RENDERER
          # ==========================================

          def create_frame(
              visible_text,
              photo_progress=0
          ):

              image = Image.new(
                  "RGB",
                  (
                      WIDTH,
                      HEIGHT
                  ),
                  BG
              )

              draw = ImageDraw.Draw(
                  image
              )


              # ======================================
              # HEADER
              # ======================================

              draw.text(
                  (28, 20),
                  "CHINMAY_OS v1.0",
                  font=FONT_SMALL,
                  fill=MUTED
              )


              draw.text(
                  (
                      WIDTH // 2,
                      20
                  ),
                  "TERMINAL // PROFILE",
                  font=FONT_SMALL,
                  fill=MUTED,
                  anchor="ma"
              )


              draw.text(
                  (
                      WIDTH - 28,
                      20
                  ),
                  "ONLINE",
                  font=FONT_SMALL,
                  fill=GREEN,
                  anchor="ra"
              )


              # ======================================
              # PHOTO
              # ======================================

              add_photo(
                  image,
                  photo_progress
              )


              # ======================================
              # TERMINAL TEXT
              # ======================================

              y = 72


              for index, (_, kind) in enumerate(lines):

                  if index >= len(visible_text):
                      break


                  current_text = visible_text[index]


                  if kind == "name":

                      font = FONT_LARGE
                      color = WHITE
                      spacing = 45


                  elif kind == "muted":

                      font = FONT_SMALL
                      color = MUTED
                      spacing = 31


                  elif kind == "command":

                      font = FONT_NORMAL
                      color = GREEN
                      spacing = 32


                  elif kind == "online":

                      font = FONT_NORMAL
                      color = GREEN
                      spacing = 32


                  else:

                      font = FONT_NORMAL
                      color = WHITE
                      spacing = 31


                  # ==================================
                  # TEXT WIDTH PROTECTION
                  # ==================================

                  # Prevent long lines from entering
                  # the reserved photo area.

                  max_width = (
                      TEXT_RIGHT -
                      TEXT_X
                  )


                  # For normal JSON text, use the
                  # terminal's fixed-width font.
                  #
                  # If a line is too long, reduce
                  # its visible length rather than
                  # allowing overlap.

                  if (
                      draw.textlength(
                          current_text,
                          font=font
                      ) > max_width
                  ):

                      while (
                          len(current_text) > 0
                          and
                          draw.textlength(
                              current_text,
                              font=font
                          ) > max_width
                      ):

                          current_text = (
                              current_text[:-1]
                          )


                  draw.text(
                      (
                          TEXT_X,
                          y
                      ),
                      current_text,
                      font=font,
                      fill=color
                  )


                  y += spacing


              return image


          # ==========================================
          # GENERATE ANIMATION
          # ==========================================

          frames = []


          # Faster typing.
          FRAMES_PER_CHARACTER = 1


          # ==========================================
          # INITIAL FRAME
          # ==========================================

          frames.append(
              create_frame(
                  [],
                  0
              )
          )


          # ==========================================
          # TYPE FROM TOP TO BOTTOM
          # ==========================================

          for line_index, (text, kind) in enumerate(lines):


              # Already completed lines.
              visible = [
                  lines[i][0]
                  for i in range(
                      line_index
                  )
              ]


              visible.append("")


              # ======================================
              # CHARACTER-BY-CHARACTER ANIMATION
              # ======================================

              for character_index in range(
                  1,
                  len(text) + 1
              ):

                  visible[-1] = (
                      text[
                          :character_index
                      ]
                  )


                  # ==================================
                  # PHOTO PARALLEL ANIMATION
                  # ==================================

                  photo_progress = 0


                  # Start revealing the photo when
                  # "Chinmay Bhat" begins typing.

                  if kind == "name":

                      photo_progress = (
                          character_index /
                          len(text)
                      )


                  # If the name has already completed,
                  # keep the photo visible.

                  elif line_index > 1:

                      photo_progress = 1


                  frame = create_frame(
                      visible.copy(),
                      photo_progress
                  )


                  frames.append(
                      frame
                  )


                  # ==================================
                  # FRAME RATE
                  # ==================================

                  for _ in range(
                      FRAMES_PER_CHARACTER - 1
                  ):

                      frames.append(
                          frame
                      )


              # ======================================
              # PAUSE AFTER EACH LINE
              # ======================================

              finished_frame = create_frame(
                  visible.copy(),
                  1 if line_index > 1 else (
                      1 if kind == "name"
                      else 0
                  )
              )


              for _ in range(2):

                  frames.append(
                      finished_frame
                  )


          # ==========================================
          # FINAL FRAME
          # ==========================================

          final_frame = create_frame(
              [
                  line[0]
                  for line in lines
              ],
              1
          )


          # Hold final state.
          for _ in range(35):

              frames.append(
                  final_frame
              )


          # ==========================================
          # SAVE GIF
          # ==========================================

          # IMPORTANT:
          # Do NOT use loop=0.
          #
          # loop=0 means infinite looping.
          #
          # By leaving loop unspecified, the GIF
          # plays once and stops on the final frame.

          frames[0].save(
              "profile-card.gif",
              save_all=True,
              append_images=frames[1:],
              duration=35,
              optimize=True
          )


          print(
              "Terminal profile card generated successfully."
          )


          PY


      # ==========================================
      # COMMIT UPDATED PROFILE
      # ==========================================

      - name: Commit updated profile
        run: |

          git config user.name "Chinmay Bhat"

          git config user.email "chinmaybhat992@gmail.com"

          git add profile.json profile-card.gif

          git diff --cached --quiet || \
            git commit -m "Update profile"

          git push