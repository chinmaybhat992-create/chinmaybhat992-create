name: Update Age

on:
  schedule:
    # Every day at 05:35 AM IST
    - cron: "5 0 * * *"

  # Allows manual execution from GitHub Actions
  workflow_dispatch:

jobs:
  update-age:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update profile and generate card
        run: |
          python3 << 'PY'
          import json
          from datetime import date
          from xml.sax.saxutils import escape

          # ==========================================
          # DATE CALCULATION
          # ==========================================

          DOB = date(2006, 9, 27)
          TODAY = date.today()

          years = TODAY.year - DOB.year

          if (TODAY.month, TODAY.day) < (DOB.month, DOB.day):
              years -= 1

          last_birthday = date(
              DOB.year + years,
              DOB.month,
              DOB.day
          )

          months = TODAY.month - last_birthday.month

          if TODAY.day < last_birthday.day:
              months -= 1

          if months < 0:
              months += 12

          if TODAY.day >= last_birthday.day:
              days = TODAY.day - last_birthday.day
          else:
              previous_month = TODAY.month - 1

              if previous_month == 0:
                  previous_month = 12
                  previous_year = TODAY.year - 1
              else:
                  previous_year = TODAY.year

              days = (
                  TODAY - date(
                      previous_year,
                      previous_month,
                      last_birthday.day
                  )
              ).days

          age = f"{years} years, {months} months, {days} days"


          # ==========================================
          # UPDATE profile.json
          # ==========================================

          with open("profile.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          data["age"] = age

          with open("profile.json", "w", encoding="utf-8") as file:
              json.dump(data, file, indent=2)
              file.write("\n")


          # ==========================================
          # ESCAPE DATA FOR SVG
          # ==========================================

          name = escape(data["name"])
          age = escape(data["age"])
          college = escape(data["college"])
          degree = escape(data["degree"])
          graduation = escape(str(data["graduation"]))


          # ==========================================
          # GENERATE CRT TERMINAL PROFILE CARD
          # ==========================================

          svg = f'''<svg
          width="900"
          height="410"
          viewBox="0 0 900 410"
          xmlns="http://www.w3.org/2000/svg">

            <defs>

              <!-- CRT scanlines -->
              <pattern
                id="scanlines"
                width="4"
                height="4"
                patternUnits="userSpaceOnUse">

                <rect
                  width="4"
                  height="2"
                  fill="#39ff14"
                  opacity="0.035"/>

              </pattern>


              <!-- Phosphor glow -->
              <filter
                id="glow"
                x="-30%"
                y="-30%"
                width="160%"
                height="160%">

                <feGaussianBlur
                  stdDeviation="2.2"
                  result="blur"/>

                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>

              </filter>


              <!-- CRT vignette -->
              <radialGradient id="vignette">

                <stop
                  offset="0%"
                  stop-color="#061006"
                  stop-opacity="0"/>

                <stop
                  offset="75%"
                  stop-color="#020502"
                  stop-opacity="0.08"/>

                <stop
                  offset="100%"
                  stop-color="#000000"
                  stop-opacity="0.65"/>

              </radialGradient>

            </defs>


            <!-- ====================================== -->
            <!-- CRT SCREEN -->
            <!-- ====================================== -->

            <rect
              x="1"
              y="1"
              width="898"
              height="408"
              fill="#030603"
              stroke="#39ff14"
              stroke-width="1"/>


            <!-- Scanlines -->

            <rect
              x="1"
              y="1"
              width="898"
              height="408"
              fill="url(#scanlines)"/>


            <!-- Vignette -->

            <rect
              x="1"
              y="1"
              width="898"
              height="408"
              fill="url(#vignette)"/>


            <!-- ====================================== -->
            <!-- TERMINAL HEADER -->
            <!-- ====================================== -->

            <g
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
              filter="url(#glow)">

              <text
                x="28"
                y="30"
                font-size="12"
                fill="#39ff14">
                CHINMAY_OS v1.0
              </text>


              <text
                x="450"
                y="30"
                text-anchor="middle"
                font-size="12"
                fill="#39ff14">
                TERMINAL // PROFILE
              </text>


              <text
                x="872"
                y="30"
                text-anchor="end"
                font-size="12"
                fill="#39ff14">
                ONLINE
              </text>

            </g>


            <!-- HEADER LINE -->

            <line
              x1="20"
              y1="45"
              x2="880"
              y2="45"
              stroke="#39ff14"
              stroke-width="1"
              opacity="0.75"/>


            <!-- ====================================== -->
            <!-- WHOAMI -->
            <!-- ====================================== -->

            <g
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
              filter="url(#glow)">

              <text
                x="28"
                y="72"
                font-size="13"
                fill="#39ff14">
                &gt; whoami
              </text>


              <text
                x="28"
                y="96"
                font-size="18"
                font-weight="bold"
                fill="#39ff14">
                {name}
              </text>


              <text
                x="28"
                y="117"
                font-size="12"
                fill="#26b912">
                COMPUTER SCIENCE / DEVELOPER / OPEN SOURCE
              </text>

            </g>


            <!-- ====================================== -->
            <!-- PROFILE COMMAND -->
            <!-- ====================================== -->

            <text
              x="28"
              y="148"
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
              font-size="13"
              fill="#39ff14"
              filter="url(#glow)">
              &gt; cat profile.json
            </text>


            <!-- ====================================== -->
            <!-- JSON BORDER -->
            <!-- ====================================== -->

            <rect
              x="28"
              y="165"
              width="844"
              height="165"
              fill="none"
              stroke="#26b912"
              stroke-width="1"
              opacity="0.65"/>


            <!-- ====================================== -->
            <!-- JSON CONTENT -->
            <!-- ====================================== -->

            <g
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
              font-size="13"
              filter="url(#glow)">

              <!-- Opening brace -->

              <text
                x="45"
                y="190"
                fill="#39ff14">
                &#123;
              </text>


              <!-- AGE -->

              <text
                x="62"
                y="216"
                fill="#39ff14">
                "age"
              </text>

              <text
                x="125"
                y="216"
                fill="#26b912">
                :
              </text>

              <text
                x="145"
                y="216"
                fill="#39ff14">
                "{age}"
              </text>


              <!-- COLLEGE -->

              <text
                x="62"
                y="243"
                fill="#39ff14">
                "college"
              </text>

              <text
                x="125"
                y="243"
                fill="#26b912">
                :
              </text>

              <text
                x="145"
                y="243"
                fill="#39ff14">
                "{college}"
              </text>


              <!-- DEGREE -->

              <text
                x="62"
                y="270"
                fill="#39ff14">
                "degree"
              </text>

              <text
                x="125"
                y="270"
                fill="#26b912">
                :
              </text>

              <text
                x="145"
                y="270"
                fill="#39ff14">
                "{degree}"
              </text>


              <!-- GRADUATION -->

              <text
                x="62"
                y="297"
                fill="#39ff14">
                "graduation"
              </text>

              <text
                x="145"
                y="297"
                fill="#26b912">
                :
              </text>

              <text
                x="165"
                y="297"
                fill="#39ff14">
                {graduation}
              </text>


              <!-- Closing brace -->

              <text
                x="45"
                y="320"
                fill="#39ff14">
                &#125;
              </text>

            </g>


            <!-- ====================================== -->
            <!-- STATUS -->
            <!-- ====================================== -->

            <text
              x="28"
              y="357"
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
              font-size="13"
              fill="#39ff14"
              filter="url(#glow)">
              &gt; status
            </text>


            <text
              x="105"
              y="357"
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
              font-size="13"
              fill="#39ff14"
              filter="url(#glow)">
              [ ONLINE ]
            </text>


            <!-- CURSOR -->

            <text
              x="28"
              y="385"
              font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
              font-size="13"
              fill="#39ff14"
              filter="url(#glow)">
              &gt; _
            </text>

          </svg>'''


          # ==========================================
          # SAVE SVG
          # ==========================================

          with open("profile-card.svg", "w", encoding="utf-8") as file:
              file.write(svg)

          PY


      - name: Commit updated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile.json profile-card.svg

          git diff --cached --quiet || git commit -m "Update profile"

          git push