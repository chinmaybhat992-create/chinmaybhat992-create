name: Update Age

on:
  schedule:
    # Every day at 05:35 AM IST
    - cron: "5 0 * * *"

  workflow_dispatch:

jobs:
  update-age:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update profile and generate card
        run: |
          python3 << 'PY'
          import json
          from datetime import date
          from xml.sax.saxutils import escape

          # ==========================================
          # DATE CALCULATION
          # ==========================================

          DOB = date(2006, 9, 27)
          TODAY = date.today()

          years = TODAY.year - DOB.year

          if (TODAY.month, TODAY.day) < (DOB.month, DOB.day):
              years -= 1

          last_birthday = date(
              DOB.year + years,
              DOB.month,
              DOB.day
          )

          months = TODAY.month - last_birthday.month

          if TODAY.day < last_birthday.day:
              months -= 1

          if months < 0:
              months += 12

          if TODAY.day >= last_birthday.day:
              days = TODAY.day - last_birthday.day
          else:
              previous_month = TODAY.month - 1

              if previous_month == 0:
                  previous_month = 12
                  previous_year = TODAY.year - 1
              else:
                  previous_year = TODAY.year

              days = (
                  TODAY - date(
                      previous_year,
                      previous_month,
                      last_birthday.day
                  )
              ).days

          age = f"{years} years, {months} months, {days} days"


          # ==========================================
          # UPDATE profile.json
          # ==========================================

          with open("profile.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          data["age"] = age

          with open("profile.json", "w", encoding="utf-8") as file:
              json.dump(data, file, indent=2)
              file.write("\n")


          # ==========================================
          # ESCAPE DATA
          # ==========================================

          name = escape(data["name"])
          age = escape(data["age"])
          college = escape(data["college"])
          degree = escape(data["degree"])
          graduation = escape(str(data["graduation"]))


          # ==========================================
          # TERMINAL SETTINGS
          # ==========================================

          FONT = (
              "ui-monospace, SFMono-Regular, Menlo, Monaco, "
              "Consolas, 'Liberation Mono', monospace"
          )

          GREEN = "#39ff14"
          DIM_GREEN = "#20a80f"


          # ==========================================
          # ONE-SHOT TYPING ANIMATION
          # ==========================================

          def type_line(
              text_id,
              x,
              y,
              text,
              begin,
              duration,
              width,
              font_size=17,
              weight="normal",
              color=GREEN
          ):

              return f'''
              <clipPath id="clip_{text_id}">
                <rect
                  x="{x}"
                  y="{y - font_size}"
                  width="0"
                  height="{font_size + 12}">

                  <animate
                    attributeName="width"
                    from="0"
                    to="{width}"
                    begin="{begin}s"
                    dur="{duration}s"
                    fill="freeze"/>

                </rect>
              </clipPath>

              <text
                x="{x}"
                y="{y}"
                font-family="{FONT}"
                font-size="{font_size}"
                font-weight="{weight}"
                fill="{color}"
                clip-path="url(#clip_{text_id})"
                filter="url(#glow)">

                {text}

              </text>
              '''


          # ==========================================
          # HEADER
          # ==========================================

          header_left = type_line(
              "header_left",
              28,
              34,
              "CHINMAY_OS v1.0",
              0,
              0.6,
              220,
              15
          )

          header_center = type_line(
              "header_center",
              450,
              34,
              "TERMINAL // PROFILE",
              0.2,
              0.7,
              240,
              15
          )

          header_right = type_line(
              "header_right",
              870,
              34,
              "ONLINE",
              0.4,
              0.5,
              90,
              15
          )


          # ==========================================
          # WHOAMI
          # ==========================================

          whoami = type_line(
              "whoami",
              30,
              82,
              "&gt; whoami",
              1.1,
              0.5,
              150,
              18
          )

          name_line = type_line(
              "name",
              30,
              116,
              name,
              1.8,
              0.8,
              350,
              27,
              "bold"
          )

          subtitle = type_line(
              "subtitle",
              30,
              144,
              "COMPUTER SCIENCE / DEVELOPER / OPEN SOURCE",
              2.8,
              0.9,
              540,
              15,
              "normal",
              DIM_GREEN
          )


          # ==========================================
          # PROFILE COMMAND
          # ==========================================

          cat_command = type_line(
              "cat",
              30,
              178,
              "&gt; cat profile.json",
              4.0,
              0.6,
              260,
              18
          )


          # ==========================================
          # JSON
          # ==========================================

          opening = type_line(
              "opening",
              55,
              218,
              "&#123;",
              4.8,
              0.25,
              35,
              18
          )

          age_line = type_line(
              "age",
              80,
              248,
              f'"age"        : "{age}"',
              5.2,
              0.75,
              650,
              17
          )

          college_line = type_line(
              "college",
              80,
              278,
              f'"college"    : "{college}"',
              6.1,
              0.9,
              790,
              17
          )

          degree_line = type_line(
              "degree",
              80,
              308,
              f'"degree"     : "{degree}"',
              7.2,
              0.65,
              520,
              17
          )

          graduation_line = type_line(
              "graduation",
              80,
              338,
              f'"graduation" : {graduation}',
              8.0,
              0.6,
              300,
              17
          )

          closing = type_line(
              "closing",
              55,
              368,
              "&#125;",
              8.8,
              0.25,
              35,
              18
          )


          # ==========================================
          # STATUS
          # ==========================================

          status = type_line(
              "status",
              30,
              408,
              "&gt; status",
              9.5,
              0.5,
              150,
              18
          )

          online = type_line(
              "online",
              155,
              408,
              "[ ONLINE ]",
              10.1,
              0.6,
              180,
              18
          )

          cursor = type_line(
              "cursor",
              30,
              438,
              "&gt; _",
              10.9,
              0.3,
              60,
              18
          )


          # ==========================================
          # GENERATE SVG
          # ==========================================

          svg = f'''<svg
            width="900"
            height="460"
            viewBox="0 0 900 460"
            xmlns="http://www.w3.org/2000/svg">

            <defs>

              <!-- CRT scanlines -->

              <pattern
                id="scanlines"
                width="4"
                height="4"
                patternUnits="userSpaceOnUse">

                <rect
                  width="4"
                  height="2"
                  fill="{GREEN}"
                  opacity="0.035"/>

              </pattern>


              <!-- Green phosphor glow -->

              <filter
                id="glow"
                x="-30%"
                y="-30%"
                width="160%"
                height="160%">

                <feGaussianBlur
                  stdDeviation="1.8"
                  result="blur"/>

                <feMerge>

                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>

                </feMerge>

              </filter>


              <!-- CRT vignette -->

              <radialGradient id="vignette">

                <stop
                  offset="0%"
                  stop-color="#061006"
                  stop-opacity="0"/>

                <stop
                  offset="70%"
                  stop-color="#020502"
                  stop-opacity="0.08"/>

                <stop
                  offset="100%"
                  stop-color="#000000"
                  stop-opacity="0.7"/>

              </radialGradient>

            </defs>


            <!-- ====================================== -->
            <!-- SCREEN -->
            <!-- ====================================== -->

            <rect
              x="1"
              y="1"
              width="898"
              height="458"
              fill="#020402"
              stroke="{GREEN}"
              stroke-width="1.5"/>


            <!-- Scanlines -->

            <rect
              x="1"
              y="1"
              width="898"
              height="458"
              fill="url(#scanlines)"/>


            <!-- Vignette -->

            <rect
              x="1"
              y="1"
              width="898"
              height="458"
              fill="url(#vignette)"/>


            <!-- ====================================== -->
            <!-- HEADER -->
            <!-- ====================================== -->

            {header_left}

            {header_center}

            {header_right}


            <line
              x1="20"
              y1="52"
              x2="880"
              y2="52"
              stroke="{GREEN}"
              stroke-width="1"
              opacity="0.7"/>


            <!-- ====================================== -->
            <!-- WHOAMI -->
            <!-- ====================================== -->

            {whoami}

            {name_line}

            {subtitle}


            <!-- ====================================== -->
            <!-- CAT COMMAND -->
            <!-- ====================================== -->

            {cat_command}


            <!-- JSON BORDER -->

            <rect
              x="28"
              y="192"
              width="844"
              height="190"
              fill="none"
              stroke="{DIM_GREEN}"
              stroke-width="1"
              opacity="0.6"/>


            <!-- JSON CONTENT -->

            {opening}

            {age_line}

            {college_line}

            {degree_line}

            {graduation_line}

            {closing}


            <!-- ====================================== -->
            <!-- STATUS -->
            <!-- ====================================== -->

            {status}

            {online}

            {cursor}

          </svg>'''


          # ==========================================
          # SAVE SVG
          # ==========================================

          with open("profile-card.svg", "w", encoding="utf-8") as file:
              file.write(svg)

          PY


      - name: Commit updated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile.json profile-card.svg

          git diff --cached --quiet || git commit -m "Update profile"

          git push