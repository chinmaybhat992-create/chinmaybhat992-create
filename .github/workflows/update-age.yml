name: Update Age

on:
  schedule:
    # Every day at 05:35 AM IST
    - cron: "5 0 * * *"

  workflow_dispatch:

jobs:
  update-age:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================
      # INSTALL PILLOW
      # ==========================================

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pillow


      # ==========================================
      # UPDATE PROFILE + GENERATE TERMINAL CARD
      # ==========================================

      - name: Update profile and generate terminal card
        run: |
          python3 << 'PY'

          import json
          from datetime import date
          from PIL import Image, ImageDraw, ImageFont, ImageFilter


          # ==========================================
          # DATE CALCULATION
          # ==========================================

          DOB = date(2006, 9, 27)
          TODAY = date.today()

          years = TODAY.year - DOB.year

          if (TODAY.month, TODAY.day) < (DOB.month, DOB.day):
              years -= 1

          last_birthday = date(
              DOB.year + years,
              DOB.month,
              DOB.day
          )

          months = TODAY.month - last_birthday.month

          if TODAY.day < last_birthday.day:
              months -= 1

          if months < 0:
              months += 12

          if TODAY.day >= last_birthday.day:

              days = TODAY.day - last_birthday.day

          else:

              previous_month = TODAY.month - 1

              if previous_month == 0:
                  previous_month = 12
                  previous_year = TODAY.year - 1
              else:
                  previous_year = TODAY.year

              days = (
                  TODAY
                  - date(
                      previous_year,
                      previous_month,
                      last_birthday.day
                  )
              ).days

          age = f"{years} years, {months} months, {days} days"


          # ==========================================
          # UPDATE profile.json
          # ==========================================

          with open(
              "profile.json",
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          data["age"] = age


          with open(
              "profile.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  data,
                  file,
                  indent=2
              )

              file.write("\n")


          # ==========================================
          # PROFILE DATA
          # ==========================================

          name = data["name"]
          college = data["college"]
          degree = data["degree"]
          graduation = str(data["graduation"])


          # ==========================================
          # IMAGE SETTINGS
          # ==========================================

          WIDTH = 900
          HEIGHT = 460

          BG = (13, 17, 23)

          WHITE = (240, 246, 252)

          MUTED = (139, 148, 158)

          GREEN = (63, 185, 80)


          # ==========================================
          # PHOTO SETTINGS
          # ==========================================

          PHOTO_X = 700
          PHOTO_Y = 78

          PHOTO_WIDTH = 230
          PHOTO_HEIGHT = 330


          # ==========================================
          # FONTS
          # ==========================================

          FONT_PATH = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSansMono.ttf"
          )

          BOLD_FONT_PATH = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSansMono-Bold.ttf"
          )


          FONT_SMALL = ImageFont.truetype(
              FONT_PATH,
              15
          )

          FONT_NORMAL = ImageFont.truetype(
              FONT_PATH,
              18
          )

          FONT_LARGE = ImageFont.truetype(
              BOLD_FONT_PATH,
              27
          )


          # ==========================================
          # TERMINAL CONTENT
          # ==========================================

          lines = [

              ("> whoami", "command"),

              (name, "name"),

              (
                  "COMPUTER SCIENCE / DEVELOPER / OPEN SOURCE",
                  "muted"
              ),

              ("> cat profile.json", "command"),

              ("{", "json"),

              (
                  f'  "age"        : "{age}"',
                  "json"
              ),

              (
                  f'  "college"    : "{college}"',
                  "json"
              ),

              (
                  f'  "degree"     : "{degree}"',
                  "json"
              ),

              (
                  f'  "graduation" : {graduation}',
                  "json"
              ),

              ("}", "json"),

              ("> status", "command"),

              ("[ ONLINE ]", "online"),

              ("> _", "command")
          ]


          # ==========================================
          # LOAD PROFILE PHOTO
          # ==========================================

          original_photo = Image.open(
              "profile-photo.jpg"
          ).convert("RGB")


          # ==========================================
          # PREPARE TERMINAL-STYLE PHOTO
          # ==========================================

          original_photo.thumbnail(
              (
                  PHOTO_WIDTH,
                  PHOTO_HEIGHT
              ),
              Image.Resampling.LANCZOS
          )


          photo = Image.new(
              "RGB",
              (
                  PHOTO_WIDTH,
                  PHOTO_HEIGHT
              ),
              BG
          )


          # Center the resized photo

          offset_x = (
              PHOTO_WIDTH
              - original_photo.width
          ) // 2

          offset_y = (
              PHOTO_HEIGHT
              - original_photo.height
          ) // 2


          photo.paste(
              original_photo,
              (
                  offset_x,
                  offset_y
              )
          )


          # ==========================================
          # CONVERT PHOTO TO TERMINAL MONOCHROME
          # ==========================================

          gray = photo.convert("L")


          # Increase contrast slightly

          gray = gray.point(
              lambda p: min(
                  255,
                  max(
                      0,
                      int((p - 128) * 1.35 + 128)
                  )
              )
          )


          # ==========================================
          # GREEN TERMINAL COLOR
          # ==========================================

          green_photo = Image.new(
              "RGB",
              gray.size,
              (0, 70, 20)
          )


          green_photo = Image.composite(
              Image.new(
                  "RGB",
                  gray.size,
                  (70, 220, 95)
              ),
              green_photo,
              gray
          )


          photo = green_photo


          # ==========================================
          # DARKEN PHOTO
          # ==========================================

          dark_overlay = Image.new(
              "RGBA",
              photo.size,
              (0, 0, 0, 75)
          )

          photo = photo.convert("RGBA")

          photo.alpha_composite(
              dark_overlay
          )


          # ==========================================
          # TERMINAL SCANLINES
          # ==========================================

          scanlines = Image.new(
              "RGBA",
              photo.size,
              (0, 0, 0, 0)
          )

          scan_draw = ImageDraw.Draw(
              scanlines
          )


          for y in range(
              0,
              PHOTO_HEIGHT,
              4
          ):

              scan_draw.line(
                  (
                      0,
                      y,
                      PHOTO_WIDTH,
                      y
                  ),
                  fill=(0, 0, 0, 85),
                  width=1
              )


          photo.alpha_composite(
              scanlines
          )


          # ==========================================
          # SOFT TERMINAL GLOW
          # ==========================================

          glow = photo.filter(
              ImageFilter.GaussianBlur(
                  radius=2
              )
          )

          glow.putalpha(45)

          photo.alpha_composite(
              glow
          )


          # ==========================================
          # PHOTO REVEAL
          # ==========================================

          def create_photo_layer(
              reveal_progress
          ):

              layer = Image.new(
                  "RGBA",
                  (
                      PHOTO_WIDTH,
                      PHOTO_HEIGHT
                  ),
                  (
                      0,
                      0,
                      0,
                      0
                  )
              )


              # Reveal from top to bottom

              reveal_height = int(
                  PHOTO_HEIGHT
                  * reveal_progress
              )


              if reveal_height <= 0:
                  return layer


              visible_photo = photo.crop(
                  (
                      0,
                      0,
                      PHOTO_WIDTH,
                      reveal_height
                  )
              )


              # Fade the bottom edge slightly

              if reveal_height > 8:

                  fade = Image.new(
                      "L",
                      (
                          PHOTO_WIDTH,
                          8
                      ),
                      255
                  )

                  fade_draw = ImageDraw.Draw(
                      fade
                  )

                  for i in range(8):

                      alpha = int(
                          255
                          * (
                              i / 7
                          )
                      )

                      fade_draw.line(
                          (
                              0,
                              i,
                              PHOTO_WIDTH,
                              i
                          ),
                          fill=alpha
                      )

                  alpha_mask = visible_photo.getchannel(
                      "A"
                  )

                  alpha_mask.paste(
                      fade,
                      (
                          0,
                          reveal_height - 8
                      )
                  )

                  visible_photo.putalpha(
                      alpha_mask
                  )


              layer.alpha_composite(
                  visible_photo,
                  (
                      0,
                      0
                  )
              )


              return layer


          # ==========================================
          # FRAME RENDERER
          # ==========================================

          def create_frame(
              visible_text,
              photo_progress
          ):

              image = Image.new(
                  "RGB",
                  (
                      WIDTH,
                      HEIGHT
                  ),
                  BG
              )

              draw = ImageDraw.Draw(
                  image
              )


              # ======================================
              # TERMINAL HEADER
              # ======================================

              draw.text(
                  (28, 20),
                  "CHINMAY_OS v1.0",
                  font=FONT_SMALL,
                  fill=MUTED
              )


              draw.text(
                  (
                      WIDTH // 2,
                      20
                  ),
                  "TERMINAL // PROFILE",
                  font=FONT_SMALL,
                  fill=MUTED,
                  anchor="ma"
              )


              draw.text(
                  (
                      WIDTH - 28,
                      20
                  ),
                  "ONLINE",
                  font=FONT_SMALL,
                  fill=GREEN,
                  anchor="ra"
              )


              # ======================================
              # PHOTO
              # ======================================

              photo_layer = create_photo_layer(
                  photo_progress
              )


              image = Image.alpha_composite(
                  image.convert("RGBA"),
                  photo_layer
              ).convert("RGB")


              draw = ImageDraw.Draw(
                  image
              )


              # ======================================
              # TERMINAL CONTENT
              # ======================================

              y = 72


              for index, (_, kind) in enumerate(lines):

                  if index >= len(visible_text):
                      break


                  current_text = visible_text[index]


                  if kind == "name":

                      font = FONT_LARGE

                      color = WHITE

                      spacing = 45


                  elif kind == "muted":

                      font = FONT_SMALL

                      color = MUTED

                      spacing = 31


                  elif kind == "command":

                      font = FONT_NORMAL

                      color = GREEN

                      spacing = 32


                  elif kind == "online":

                      font = FONT_NORMAL

                      color = GREEN

                      spacing = 32


                  else:

                      font = FONT_NORMAL

                      color = WHITE

                      spacing = 31


                  draw.text(
                      (
                          30,
                          y
                      ),
                      current_text,
                      font=font,
                      fill=color
                  )


                  y += spacing


              return image


          # ==========================================
          # GENERATE ANIMATION
          # ==========================================

          frames = []


          # Faster typing

          FRAMES_PER_CHARACTER = 1


          # ==========================================
          # INITIAL FRAME
          # ==========================================

          frames.append(
              create_frame(
                  [],
                  0
              )
          )


          # ==========================================
          # TYPE TEXT + REVEAL PHOTO TOGETHER
          # ==========================================

          total_animation_characters = sum(
              len(text)
              for text, kind in lines
              if kind != "command"
              or text == name
          )


          # Photo begins when "Chinmay Bhat" starts.

          photo_started = False

          photo_progress = 0.0


          # Approximate number of frames available
          # from the beginning of the name until
          # the end of the profile.

          name_index = 1


          characters_after_name = sum(
              len(lines[i][0])
              for i in range(
                  name_index,
                  len(lines)
              )
          )


          photo_reveal_steps = max(
              1,
              characters_after_name
          )


          photo_step = (
              1.0
              / photo_reveal_steps
          )


          for line_index, (
              text,
              kind
          ) in enumerate(lines):


              visible = [
                  lines[i][0]
                  for i in range(line_index)
              ]


              visible.append("")


              # ======================================
              # CHARACTER-BY-CHARACTER TYPING
              # ======================================

              for character_index in range(
                  1,
                  len(text) + 1
              ):


                  visible[-1] = text[
                      :character_index
                  ]


                  # ----------------------------------
                  # START PHOTO WITH NAME
                  # ----------------------------------

                  if (
                      line_index == name_index
                  ):

                      photo_started = True


                  # ----------------------------------
                  # PHOTO REVEAL
                  # ----------------------------------

                  if photo_started:

                      if line_index >= name_index:

                          photo_progress += (
                              photo_step
                          )

                          photo_progress = min(
                              1.0,
                              photo_progress
                          )


                  frame = create_frame(
                      visible.copy(),
                      photo_progress
                  )


                  frames.append(
                      frame
                  )


              # ======================================
              # PAUSE AFTER EACH LINE
              # ======================================

              finished_frame = create_frame(
                  visible.copy(),
                  photo_progress
              )


              for _ in range(2):

                  frames.append(
                      finished_frame
                  )


          # ==========================================
          # FINAL FRAME
          # ==========================================

          final_frame = create_frame(
              [
                  line[0]
                  for line in lines
              ],
              1.0
          )


          # ==========================================
          # HOLD FINAL STATE
          # ==========================================

          for _ in range(30):

              frames.append(
                  final_frame
              )


          # ==========================================
          # SAVE GIF
          # ==========================================

          frames[0].save(
              "profile-card.gif",
              save_all=True,
              append_images=frames[1:],
              duration=35,
              loop=0,
              optimize=True
          )


          print(
              f"Generated {len(frames)} animation frames."
          )

          print(
              "Profile age:",
              age
          )

          print(
              "Terminal photo generated successfully."
          )

          PY


      # ==========================================
      # COMMIT UPDATED PROFILE
      # ==========================================

      - name: Commit updated profile
        run: |

          git config user.name "Chinmay Bhat"

          git config user.email "chinmaybhat992@gmail.com"

          git add profile.json profile-card.gif

          git diff --cached --quiet || \
            git commit -m "Update profile"

          git push