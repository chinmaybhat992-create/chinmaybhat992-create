name: Update Age

on:
  schedule:
    # Every day at 05:35 AM IST
    - cron: "5 0 * * *"

  workflow_dispatch:

jobs:
  update-age:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ==========================================
      # CHECKOUT REPOSITORY
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v5


      # ==========================================
      # INSTALL PILLOW
      # ==========================================

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pillow


      # ==========================================
      # UPDATE PROFILE + GENERATE TERMINAL CARD
      # ==========================================

      - name: Update profile and generate terminal card
        run: |

          python3 << 'PY'

          import json
          from datetime import date

          from PIL import (
              Image,
              ImageDraw,
              ImageFont,
              ImageEnhance,
              ImageOps
          )


          # ==========================================
          # DATE CALCULATION
          # ==========================================

          DOB = date(2006, 9, 27)
          TODAY = date.today()

          years = TODAY.year - DOB.year

          if (TODAY.month, TODAY.day) < (DOB.month, DOB.day):
              years -= 1

          last_birthday = date(
              DOB.year + years,
              DOB.month,
              DOB.day
          )

          months = TODAY.month - last_birthday.month

          if TODAY.day < last_birthday.day:
              months -= 1

          if months < 0:
              months += 12

          if TODAY.day >= last_birthday.day:

              days = TODAY.day - last_birthday.day

          else:

              previous_month = TODAY.month - 1

              if previous_month == 0:
                  previous_month = 12
                  previous_year = TODAY.year - 1
              else:
                  previous_year = TODAY.year

              days = (
                  TODAY -
                  date(
                      previous_year,
                      previous_month,
                      last_birthday.day
                  )
              ).days

          age = f"{years} years, {months} months, {days} days"


          # ==========================================
          # UPDATE profile.json
          # ==========================================

          with open(
              "profile.json",
              "r",
              encoding="utf-8"
          ) as file:

              data = json.load(file)


          data["age"] = age


          with open(
              "profile.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  data,
                  file,
                  indent=2
              )

              file.write("\n")


          # ==========================================
          # PROFILE DATA
          # ==========================================

          name = data["name"]
          college = data["college"]
          degree = data["degree"]
          graduation = str(data["graduation"])


          # ==========================================
          # CANVAS SETTINGS
          # ==========================================

          WIDTH = 900
          HEIGHT = 460

          BG = (13, 17, 23)

          WHITE = (240, 246, 252)

          MUTED = (139, 148, 158)

          GREEN = (63, 185, 80)


          # ==========================================
          # LAYOUT
          # ==========================================

          # Text starts here.

          TEXT_X = 30


          # Photo position.

          PHOTO_X = 710
          PHOTO_Y = 105

          PHOTO_WIDTH = 160
          PHOTO_HEIGHT = 270


          # ==========================================
          # FONTS
          # ==========================================

          FONT_PATH = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSansMono.ttf"
          )

          BOLD_FONT_PATH = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSansMono-Bold.ttf"
          )


          FONT_SMALL = ImageFont.truetype(
              FONT_PATH,
              15
          )

          FONT_NORMAL = ImageFont.truetype(
              FONT_PATH,
              17
          )

          FONT_LARGE = ImageFont.truetype(
              BOLD_FONT_PATH,
              27
          )


          # ==========================================
          # TERMINAL CONTENT
          # ==========================================

          lines = [

              ("> whoami", "command"),

              (name, "name"),

              (
                  "COMPUTER SCIENCE / DEVELOPER / OPEN SOURCE",
                  "muted"
              ),

              ("> cat profile.json", "command"),

              ("{", "json"),

              (
                  f'  "age"        : "{age}"',
                  "json"
              ),

              (
                  f'  "college"    : "{college}"',
                  "json"
              ),

              (
                  f'  "degree"     : "{degree}"',
                  "json"
              ),

              (
                  f'  "graduation" : {graduation}',
                  "json"
              ),

              ("}", "json"),

              ("> status", "command"),

              ("[ ONLINE ]", "online"),

              ("> _", "command")
          ]


          # ==========================================
          # PREPARE PROFILE PHOTO
          # ==========================================

          original_photo = Image.open(
              "profile-photo.jpg"
          ).convert("RGB")


          # Crop the photo into the terminal portrait
          # shape.

          original_photo = ImageOps.fit(
              original_photo,
              (
                  PHOTO_WIDTH,
                  PHOTO_HEIGHT
              ),
              method=Image.Resampling.LANCZOS,
              centering=(0.5, 0.45)
          )


          # ==========================================
          # TERMINAL PHOTO EFFECT
          # ==========================================

          photo_gray = ImageOps.grayscale(
              original_photo
          )


          photo_gray = ImageEnhance.Contrast(
              photo_gray
          ).enhance(1.35)


          # Green monochrome terminal effect.

          photo_terminal = ImageOps.colorize(
              photo_gray,
              black=(4, 15, 7),
              white=(55, 210, 75)
          )


          # ==========================================
          # SCANLINES
          # ==========================================

          photo_draw = ImageDraw.Draw(
              photo_terminal
          )


          for y in range(
              0,
              PHOTO_HEIGHT,
              4
          ):

              photo_draw.line(
                  (
                      0,
                      y,
                      PHOTO_WIDTH,
                      y
                  ),
                  fill=(5, 55, 18),
                  width=1
              )


          # ==========================================
          # PHOTO REVEAL
          # TOP → BOTTOM
          # ==========================================

          def paste_photo(
              image,
              progress
          ):

              if progress <= 0:
                  return


              progress = max(
                  0,
                  min(
                      1,
                      progress
                  )
              )


              # IMPORTANT:
              #
              # Width stays FULL.
              #
              # Height grows from TOP to BOTTOM.

              visible_height = int(
                  PHOTO_HEIGHT * progress
              )


              if visible_height <= 0:
                  return


              visible_photo = photo_terminal.crop(
                  (
                      0,
                      0,
                      PHOTO_WIDTH,
                      visible_height
                  )
              )


              image.paste(
                  visible_photo,
                  (
                      PHOTO_X,
                      PHOTO_Y
                  )
              )


          # ==========================================
          # CREATE FRAME
          # ==========================================

          def create_frame(
              visible_text,
              photo_progress=0
          ):

              image = Image.new(
                  "RGB",
                  (
                      WIDTH,
                      HEIGHT
                  ),
                  BG
              )

              draw = ImageDraw.Draw(
                  image
              )


              # ======================================
              # TERMINAL HEADER
              # ======================================

              draw.text(
                  (28, 20),
                  "CHINMAY_OS v1.0",
                  font=FONT_SMALL,
                  fill=MUTED
              )


              draw.text(
                  (
                      WIDTH // 2,
                      20
                  ),
                  "TERMINAL // PROFILE",
                  font=FONT_SMALL,
                  fill=MUTED,
                  anchor="ma"
              )


              draw.text(
                  (
                      WIDTH - 28,
                      20
                  ),
                  "ONLINE",
                  font=FONT_SMALL,
                  fill=GREEN,
                  anchor="ra"
              )


              # ======================================
              # PHOTO
              # ======================================

              paste_photo(
                  image,
                  photo_progress
              )


              # ======================================
              # TERMINAL TEXT
              # ======================================

              y = 72


              for index, (_, kind) in enumerate(lines):

                  if index >= len(visible_text):
                      break


                  current_text = visible_text[index]


                  if kind == "name":

                      font = FONT_LARGE
                      color = WHITE
                      spacing = 45


                  elif kind == "muted":

                      font = FONT_SMALL
                      color = MUTED
                      spacing = 31


                  elif kind == "command":

                      font = FONT_NORMAL
                      color = GREEN
                      spacing = 32


                  elif kind == "online":

                      font = FONT_NORMAL
                      color = GREEN
                      spacing = 32


                  else:

                      font = FONT_NORMAL
                      color = WHITE
                      spacing = 31


                  draw.text(
                      (
                          TEXT_X,
                          y
                      ),
                      current_text,
                      font=font,
                      fill=color
                  )


                  y += spacing


              return image


          # ==========================================
          # GENERATE ANIMATION
          # ==========================================

          frames = []


          # ==========================================
          # INITIAL FRAME
          # ==========================================

          frames.append(
              create_frame(
                  [],
                  0
              )
          )


          # ==========================================
          # TYPE TERMINAL FROM TOP TO BOTTOM
          # ==========================================

          for line_index, (text, kind) in enumerate(lines):


              # Already completed lines.

              visible = [
                  lines[i][0]
                  for i in range(
                      line_index
                  )
              ]


              visible.append("")


              # ======================================
              # TYPE CURRENT LINE
              # ======================================

              for character_index in range(
                  1,
                  len(text) + 1
              ):

                  visible[-1] = (
                      text[
                          :character_index
                      ]
                  )


                  # ==================================
                  # PHOTO ANIMATION
                  # ==================================

                  if kind == "name":

                      # Photo starts exactly when
                      # the name starts typing.

                      photo_progress = (
                          character_index /
                          len(text)
                      )

                  elif line_index > 1:

                      # After the name has completed,
                      # keep the photo fully visible.

                      photo_progress = 1

                  else:

                      photo_progress = 0


                  frame = create_frame(
                      visible.copy(),
                      photo_progress
                  )


                  frames.append(
                      frame
                  )


              # ======================================
              # PAUSE AFTER CURRENT LINE
              # ======================================

              if kind == "name":

                  photo_progress = 1

              elif line_index > 1:

                  photo_progress = 1

              else:

                  photo_progress = 0


              finished_frame = create_frame(
                  visible.copy(),
                  photo_progress
              )


              for _ in range(2):

                  frames.append(
                      finished_frame
                  )


          # ==========================================
          # FINAL FRAME
          # ==========================================

          final_frame = create_frame(
              [
                  line[0]
                  for line in lines
              ],
              1
          )


          # Keep the completed card visible.

          for _ in range(35):

              frames.append(
                  final_frame
              )


          # ==========================================
          # SAVE GIF
          # ==========================================

          # IMPORTANT:
          #
          # There is intentionally NO loop=0.
          #
          # loop=0 means infinite looping.
          #
          # The GIF therefore plays once and ends
          # on the completed terminal frame.

          frames[0].save(
              "profile-card.gif",
              save_all=True,
              append_images=frames[1:],
              duration=35,
              optimize=True
          )


          print(
              "Terminal profile card generated successfully."
          )


          PY


      # ==========================================
      # COMMIT UPDATED PROFILE
      # ==========================================

      - name: Commit updated profile
        run: |

          git config user.name "Chinmay Bhat"

          git config user.email "chinmaybhat992@gmail.com"

          git add profile.json profile-card.gif

          git diff --cached --quiet || \
            git commit -m "Update profile"

          git push