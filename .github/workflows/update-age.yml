name: Update Age

on:
  schedule:
    # Every day at 05:35 AM IST
    - cron: "5 0 * * *"

  workflow_dispatch:

jobs:
  update-age:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pillow

      - name: Update profile and generate terminal animation
        run: |
          python3 << 'PY'
          import json
          import math
          from datetime import date
          from PIL import Image, ImageDraw, ImageFont


          # ==========================================
          # DATE CALCULATION
          # ==========================================

          DOB = date(2006, 9, 27)
          TODAY = date.today()

          years = TODAY.year - DOB.year

          if (TODAY.month, TODAY.day) < (DOB.month, DOB.day):
              years -= 1

          last_birthday = date(
              DOB.year + years,
              DOB.month,
              DOB.day
          )

          months = TODAY.month - last_birthday.month

          if TODAY.day < last_birthday.day:
              months -= 1

          if months < 0:
              months += 12

          if TODAY.day >= last_birthday.day:
              days = TODAY.day - last_birthday.day
          else:
              previous_month = TODAY.month - 1

              if previous_month == 0:
                  previous_month = 12
                  previous_year = TODAY.year - 1
              else:
                  previous_year = TODAY.year

              days = (
                  TODAY - date(
                      previous_year,
                      previous_month,
                      last_birthday.day
                  )
              ).days

          age = f"{years} years, {months} months, {days} days"


          # ==========================================
          # UPDATE profile.json
          # ==========================================

          with open("profile.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          data["age"] = age

          with open("profile.json", "w", encoding="utf-8") as file:
              json.dump(data, file, indent=2)
              file.write("\n")


          # ==========================================
          # TERMINAL DATA
          # ==========================================

          name = data["name"]
          college = data["college"]
          degree = data["degree"]
          graduation = str(data["graduation"])


          # ==========================================
          # IMAGE SETTINGS
          # ==========================================

          WIDTH = 1000
          HEIGHT = 500

          BG = (2, 6, 2)
          GREEN = (57, 255, 20)
          DIM_GREEN = (32, 168, 15)
          BORDER = (57, 255, 20)

          FONT_PATH = "/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf"
          BOLD_FONT_PATH = "/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf"

          FONT_SMALL = ImageFont.truetype(FONT_PATH, 17)
          FONT_NORMAL = ImageFont.truetype(FONT_PATH, 20)
          FONT_LARGE = ImageFont.truetype(BOLD_FONT_PATH, 30)


          # ==========================================
          # TERMINAL CONTENT
          # ==========================================

          lines = [
              ("> whoami", "normal"),
              (name, "large"),
              ("COMPUTER SCIENCE / DEVELOPER / OPEN SOURCE", "dim"),

              ("> cat profile.json", "normal"),

              ("{", "normal"),
              (f'  "age"        : "{age}"', "normal"),
              (f'  "college"    : "{college}"', "normal"),
              (f'  "degree"     : "{degree}"', "normal"),
              (f'  "graduation" : {graduation}', "normal"),
              ("}", "normal"),

              ("> status", "normal"),
              ("[ ONLINE ]", "normal"),
              ("> _", "normal")
          ]


          # ==========================================
          # FONT SELECTION
          # ==========================================

          def get_font(kind):
              if kind == "large":
                  return FONT_LARGE

              return FONT_NORMAL


          # ==========================================
          # CRT FRAME
          # ==========================================

          def create_frame(visible_text):

              image = Image.new(
                  "RGB",
                  (WIDTH, HEIGHT),
                  BG
              )

              draw = ImageDraw.Draw(image)


              # ------------------------------------------
              # CRT BORDER
              # ------------------------------------------

              draw.rectangle(
                  [2, 2, WIDTH - 3, HEIGHT - 3],
                  outline=BORDER,
                  width=2
              )


              # ------------------------------------------
              # HEADER
              # ------------------------------------------

              header_font = FONT_SMALL

              draw.text(
                  (28, 20),
                  "CHINMAY_OS v1.0",
                  font=header_font,
                  fill=GREEN
              )

              draw.text(
                  (WIDTH // 2, 20),
                  "TERMINAL // PROFILE",
                  font=header_font,
                  fill=GREEN,
                  anchor="ma"
              )

              draw.text(
                  (WIDTH - 28, 20),
                  "ONLINE",
                  font=header_font,
                  fill=GREEN,
                  anchor="ra"
              )


              draw.line(
                  [(20, 50), (WIDTH - 20, 50)],
                  fill=DIM_GREEN,
                  width=1
              )


              # ------------------------------------------
              # TERMINAL TEXT
              # ------------------------------------------

              y = 75

              for index, (full_text, kind) in enumerate(lines):

                  if index >= len(visible_text):
                      break

                  current_text = visible_text[index]

                  if kind == "large":
                      font = FONT_LARGE
                  elif kind == "dim":
                      font = FONT_SMALL
                  else:
                      font = FONT_NORMAL


                  color = (
                      DIM_GREEN
                      if kind == "dim"
                      else GREEN
                  )


                  draw.text(
                      (30, y),
                      current_text,
                      font=font,
                      fill=color
                  )


                  if kind == "large":
                      y += 48
                  else:
                      y += 31


              # ------------------------------------------
              # JSON BOX
              # ------------------------------------------

              json_start = 195
              json_end = 405

              draw.rectangle(
                  [20, json_start, WIDTH - 20, json_end],
                  outline=DIM_GREEN,
                  width=1
              )


              # ------------------------------------------
              # SCANLINES
              # ------------------------------------------

              for y_scan in range(0, HEIGHT, 4):

                  draw.line(
                      [(0, y_scan), (WIDTH, y_scan)],
                      fill=(8, 35, 8),
                      width=1
                  )


              # ------------------------------------------
              # SUBTLE CRT GLOW
              # ------------------------------------------

              glow = image.copy()

              glow_draw = ImageDraw.Draw(glow)

              glow_draw.rectangle(
                  [2, 2, WIDTH - 3, HEIGHT - 3],
                  outline=(20, 100, 20),
                  width=5
              )

              glow = glow.filter(
                  __import__("PIL").ImageFilter.GaussianBlur(4)
              )

              image = Image.blend(
                  glow,
                  image,
                  0.82
              )


              return image


          # ==========================================
          # BUILD TYPING SEQUENCE
          # ==========================================

          frames = []


          # Number of frames used for each character.
          FRAMES_PER_CHARACTER = 2


          # ------------------------------------------
          # Start with empty terminal
          # ------------------------------------------

          visible = [""]

          frames.append(
              create_frame(visible)
          )


          # ------------------------------------------
          # Type each line continuously
          # ------------------------------------------

          for line_index, (text, kind) in enumerate(lines):

              if line_index == 0:
                  previous = ""
              else:
                  previous = lines[line_index - 1][0]


              # Ensure earlier lines remain visible.
              visible = [
                  lines[i][0]
                  for i in range(line_index)
              ]

              visible.append("")


              # Type the current line character-by-character.
              for character_index in range(1, len(text) + 1):

                  visible[-1] = text[:character_index]

                  frame = create_frame(
                      visible.copy()
                  )

                  for _ in range(FRAMES_PER_CHARACTER):
                      frames.append(frame)


              # Pause briefly after finishing each line.
              finished = create_frame(
                  visible.copy()
              )

              for _ in range(4):
                  frames.append(finished)


          # ==========================================
          # FINAL STATIC FRAME
          # ==========================================

          final_frame = create_frame(
              [line[0] for line in lines]
          )


          # Keep final frame visible for several seconds.
          for _ in range(25):
              frames.append(final_frame)


          # ==========================================
          # SAVE GIF
          # ==========================================

          frames[0].save(
              "profile-card.gif",
              save_all=True,
              append_images=frames[1:],
              duration=45,
              loop=0,
              optimize=True
          )

          PY


      - name: Commit updated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile.json profile-card.gif

          git diff --cached --quiet || git commit -m "Update profile"

          git push