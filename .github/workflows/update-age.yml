name: Update Age

on:
  schedule:
    # Every day at 05:35 AM IST
    - cron: "5 0 * * *"

  workflow_dispatch:

jobs:
  update-age:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pillow

      - name: Update profile and generate terminal card
        run: |
          python3 << 'PY'
          import json
          from datetime import date
          from PIL import Image, ImageDraw, ImageFont


          # ==========================================
          # DATE CALCULATION
          # ==========================================

          DOB = date(2006, 9, 27)
          TODAY = date.today()

          years = TODAY.year - DOB.year

          if (TODAY.month, TODAY.day) < (DOB.month, DOB.day):
              years -= 1

          last_birthday = date(
              DOB.year + years,
              DOB.month,
              DOB.day
          )

          months = TODAY.month - last_birthday.month

          if TODAY.day < last_birthday.day:
              months -= 1

          if months < 0:
              months += 12

          if TODAY.day >= last_birthday.day:
              days = TODAY.day - last_birthday.day
          else:
              previous_month = TODAY.month - 1

              if previous_month == 0:
                  previous_month = 12
                  previous_year = TODAY.year - 1
              else:
                  previous_year = TODAY.year

              days = (
                  TODAY - date(
                      previous_year,
                      previous_month,
                      last_birthday.day
                  )
              ).days

          age = f"{years} years, {months} months, {days} days"


          # ==========================================
          # UPDATE profile.json
          # ==========================================

          with open("profile.json", "r", encoding="utf-8") as file:
              data = json.load(file)

          data["age"] = age

          with open("profile.json", "w", encoding="utf-8") as file:
              json.dump(data, file, indent=2)
              file.write("\n")


          # ==========================================
          # PROFILE DATA
          # ==========================================

          name = data["name"]
          college = data["college"]
          degree = data["degree"]
          graduation = str(data["graduation"])


          # ==========================================
          # GITHUB-STYLE TERMINAL PALETTE
          # ==========================================

          WIDTH = 900
          HEIGHT = 460

          # GitHub dark background
          BG = (13, 17, 23)

          # GitHub primary text
          WHITE = (240, 246, 252)

          # GitHub secondary text
          MUTED = (139, 148, 158)

          # GitHub border
          BORDER = (48, 54, 61)

          # GitHub green accent
          GREEN = (63, 185, 80)

          # Dark green accent
          DARK_GREEN = (35, 134, 54)

          # Very subtle scanline
          SCANLINE = (18, 24, 30)


          # ==========================================
          # FONTS
          # ==========================================

          FONT_PATH = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSansMono.ttf"
          )

          BOLD_FONT_PATH = (
              "/usr/share/fonts/truetype/dejavu/"
              "DejaVuSansMono-Bold.ttf"
          )

          FONT_SMALL = ImageFont.truetype(
              FONT_PATH,
              15
          )

          FONT_NORMAL = ImageFont.truetype(
              FONT_PATH,
              18
          )

          FONT_LARGE = ImageFont.truetype(
              BOLD_FONT_PATH,
              27
          )


          # ==========================================
          # TERMINAL CONTENT
          # ==========================================

          lines = [

              ("> whoami", "command"),

              (name, "name"),

              (
                  "COMPUTER SCIENCE / DEVELOPER / OPEN SOURCE",
                  "muted"
              ),

              ("> cat profile.json", "command"),

              ("{", "json"),

              (
                  f'  "age"        : "{age}"',
                  "json"
              ),

              (
                  f'  "college"    : "{college}"',
                  "json"
              ),

              (
                  f'  "degree"     : "{degree}"',
                  "json"
              ),

              (
                  f'  "graduation" : {graduation}',
                  "json"
              ),

              ("}", "json"),

              ("> status", "command"),

              ("[ ONLINE ]", "online"),

              ("> _", "command")
          ]


          # ==========================================
          # FRAME RENDERER
          # ==========================================

          def create_frame(visible_text):

              image = Image.new(
                  "RGB",
                  (WIDTH, HEIGHT),
                  BG
              )

              draw = ImageDraw.Draw(image)


              # ======================================
              # OUTER TERMINAL BORDER
              # ======================================

              draw.rounded_rectangle(
                  [1, 1, WIDTH - 2, HEIGHT - 2],
                  radius=8,
                  outline=BORDER,
                  width=1
              )


              # ======================================
              # HEADER
              # ======================================

              draw.text(
                  (28, 20),
                  "CHINMAY_OS v1.0",
                  font=FONT_SMALL,
                  fill=MUTED
              )

              draw.text(
                  (WIDTH // 2, 20),
                  "TERMINAL // PROFILE",
                  font=FONT_SMALL,
                  fill=MUTED,
                  anchor="ma"
              )

              draw.text(
                  (WIDTH - 28, 20),
                  "ONLINE",
                  font=FONT_SMALL,
                  fill=GREEN,
                  anchor="ra"
              )


              draw.line(
                  [(20, 50), (WIDTH - 20, 50)],
                  fill=BORDER,
                  width=1
              )


              # ======================================
              # TERMINAL CONTENT
              # ======================================

              y = 73

              for index, (_, kind) in enumerate(lines):

                  if index >= len(visible_text):
                      break

                  current_text = visible_text[index]

                  if kind == "name":
                      font = FONT_LARGE
                      color = WHITE
                      spacing = 45

                  elif kind == "muted":
                      font = FONT_SMALL
                      color = MUTED
                      spacing = 31

                  elif kind == "command":
                      font = FONT_NORMAL
                      color = GREEN
                      spacing = 32

                  elif kind == "online":
                      font = FONT_NORMAL
                      color = GREEN
                      spacing = 32

                  else:
                      font = FONT_NORMAL
                      color = WHITE
                      spacing = 31


                  draw.text(
                      (30, y),
                      current_text,
                      font=font,
                      fill=color
                  )

                  y += spacing


              # ======================================
              # JSON PANEL
              # ======================================

              draw.rounded_rectangle(
                  [20, 190, WIDTH - 20, 382],
                  radius=5,
                  outline=BORDER,
                  width=1
              )


              # ======================================
              # SUBTLE CRT SCANLINES
              # ======================================

              for scan_y in range(0, HEIGHT, 5):

                  draw.line(
                      [(0, scan_y), (WIDTH, scan_y)],
                      fill=SCANLINE,
                      width=1
                  )


              return image


          # ==========================================
          # GENERATE ONE-SHOT TYPING ANIMATION
          # ==========================================

          frames = []

          # Number of frames per character.
          # Higher = slower typing.
          FRAMES_PER_CHARACTER = 2


          # ------------------------------------------
          # Initial empty terminal
          # ------------------------------------------

          frames.append(
              create_frame([])
          )


          # ------------------------------------------
          # Type continuously from top to bottom
          # ------------------------------------------

          for line_index, (text, kind) in enumerate(lines):

              visible = [
                  lines[i][0]
                  for i in range(line_index)
              ]

              visible.append("")


              # Character-by-character typing
              for character_index in range(1, len(text) + 1):

                  visible[-1] = text[:character_index]

                  frame = create_frame(
                      visible.copy()
                  )

                  for _ in range(FRAMES_PER_CHARACTER):
                      frames.append(frame)


              # Small pause after completing line
              finished_frame = create_frame(
                  visible.copy()
              )

              for _ in range(4):
                  frames.append(finished_frame)


          # ==========================================
          # FINAL FRAME
          # ==========================================

          final_frame = create_frame(
              [line[0] for line in lines]
          )


          # Hold final state
          for _ in range(30):
              frames.append(final_frame)


          # ==========================================
          # SAVE GIF
          # ==========================================

          frames[0].save(
              "profile-card.gif",
              save_all=True,
              append_images=frames[1:],
              duration=45,
              optimize=True
          )

          PY


      - name: Commit updated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile.json profile-card.gif

          git diff --cached --quiet || git commit -m "Update profile"

          git push