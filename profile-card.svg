<svg
  width="900"
  height="390"
  viewBox="0 0 900 390"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Background -->
    <linearGradient
      id="background"
      x1="0"
      y1="0"
      x2="1"
      y2="1">

      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#151b23"/>

    </linearGradient>

    <!-- Accent -->
    <linearGradient
      id="accent"
      x1="0"
      y1="0"
      x2="1"
      y2="0">

      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b82f6"/>

    </linearGradient>

  </defs>


  <!-- CARD -->

  <rect
    x="1"
    y="1"
    width="898"
    height="388"
    rx="20"
    fill="url(#background)"
    stroke="#30363d"
    stroke-width="2"/>


  <!-- LEFT ACCENT -->

  <rect
    x="0"
    y="0"
    width="6"
    height="390"
    rx="3"
    fill="url(#accent)"/>


  <!-- TERMINAL HEADER -->

  <circle
    cx="32"
    cy="30"
    r="6"
    fill="#ff5f56"/>

  <circle
    cx="54"
    cy="30"
    r="6"
    fill="#ffbd2e"/>

  <circle
    cx="76"
    cy="30"
    r="6"
    fill="#27c93f"/>


  <text
    x="450"
    y="35"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="13"
    fill="#8b949e">

    chinmay.json

  </text>


  <!-- TERMINAL COMMAND -->

  <text
    x="45"
    y="82"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="14"
