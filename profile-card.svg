<svg
  width="900"
  height="460"
  viewBox="0 0 900 460"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- CRT scanlines -->

    <pattern
      id="scanlines"
      width="4"
      height="4"
      patternUnits="userSpaceOnUse">

      <rect
        width="4"
        height="2"
        fill="#39ff14"
        opacity="0.035"/>

    </pattern>


    <!-- Green phosphor glow -->

    <filter
      id="glow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%">

      <feGaussianBlur
        stdDeviation="1.8"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <!-- CRT vignette -->

    <radialGradient id="vignette">

      <stop
        offset="0%"
        stop-color="#061006"
        stop-opacity="0"/>

      <stop
        offset="70%"
        stop-color="#020502"
        stop-opacity="0.08"/>

      <stop
        offset="100%"
        stop-color="#000000"
        stop-opacity="0.7"/>

    </radialGradient>

  </defs>


  <!-- ====================================== -->
  <!-- SCREEN -->
  <!-- ====================================== -->

  <rect
    x="1"
    y="1"
    width="898"
    height="458"
    fill="#020402"
    stroke="#39ff14"
    stroke-width="1.5"/>


  <!-- Scanlines -->

  <rect
    x="1"
    y="1"
    width="898"
    height="458"
    fill="url(#scanlines)"/>


  <!-- Vignette -->

  <rect
    x="1"
    y="1"
    width="898"
    height="458"
    fill="url(#vignette)"/>


  <!-- ====================================== -->
  <!-- HEADER -->
  <!-- ====================================== -->

  
    <clipPath id="clip_header_left">
      <rect
        x="28"
        y="19"
        width="0"
        height="27">

        <animate
          attributeName="width"
          from="0"
          to="220"
          begin="0s"
          dur="0.6s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <text
      x="28"
      y="34"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
      font-size="15"
      font-weight="normal"
      fill="#39ff14"
      clip-path="url(#clip_header_left)"
      filter="url(#glow)">

      CHINMAY_OS v1.0

    </text>
    

  
    <clipPath id="clip_header_center">
      <rect
        x="450"
        y="19"
        width="0"
        height="27">

        <animate
          attributeName="width"
          from="0"
          to="240"
          begin="0.2s"
          dur="0.7s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <text
      x="450"
      y="34"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
      font-size="15"
      font-weight="normal"
      fill="#39ff14"
      clip-path="url(#clip_header_center)"
      filter="url(#glow)">

      TERMINAL // PROFILE

    </text>
    

  
    <clipPath id="clip_header_right">
      <rect
        x="870"
        y="19"
        width="0"
        height="27">

        <animate
          attributeName="width"
          from="0"
          to="90"
          begin="0.4s"
          dur="0.5s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <text
      x="870"
      y="34"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
      font-size="15"
      font-weight="normal"
      fill="#39ff14"
      clip-path="url(#clip_header_right)"
      filter="url(#glow)">

      ONLINE

    </text>
    


  <line
    x1="20"
    y1="52"
    x2="880"
    y2="52"
    stroke="#39ff14"
    stroke-width="1"
    opacity="0.7"/>


  <!-- ====================================== -->
  <!-- WHOAMI -->
  <!-- ====================================== -->

  
    <clipPath id="clip_whoami">
      <rect
        x="30"
        y="64"
        width="0"
        height="30">

        <animate
          attributeName="width"
          from="0"
          to="150"
          begin="1.1s"
          dur="0.5s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <text
      x="30"
      y="82"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
      font-size="18"
      font-weight="normal"
      fill="#39ff14"
      clip-path="url(#clip_whoami)"
      filter="url(#glow)">

      &gt; whoami

    </text>
    

  
    <clipPath id="clip_name">
      <rect
        x="30"
        y="89"
        width="0"
        height="39">

        <animate
          attributeName="width"
          from="0"
          to="350"
          begin="1.8s"
          dur="0.8s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <text
      x="30"
      y="116"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
      font-size="27"
      font-weight="bold"
      fill="#39ff14"
      clip-path="url(#clip_name)"
      filter="url(#glow)">

      Chinmay Bhat

    </text>
    

  
    <clipPath id="clip_subtitle">
      <rect
        x="30"
        y="129"
        width="0"
        height="27">

        <animate
          attributeName="width"
          from="0"
          to="540"
          begin="2.8s"
          dur="0.9s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <text
      x="30"
      y="144"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
      font-size="15"
      font-weight="normal"
      fill="#20a80f"
      clip-path="url(#clip_subtitle)"
      filter="url(#glow)">

      COMPUTER SCIENCE / DEVELOPER / OPEN SOURCE

    </text>
    


  <!-- ====================================== -->
  <!-- CAT COMMAND -->
  <!-- ====================================== -->

  
    <clipPath id="clip_cat">
      <rect
        x="30"
        y="160"
        width="0"
        height="30">

        <animate
          attributeName="width"
          from="0"
          to="260"
          begin="4.0s"
          dur="0.6s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <text
      x="30"
      y="178"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
      font-size="18"
      font-weight="normal"
      fill="#39ff14"
      clip-path="url(#clip_cat)"
      filter="url(#glow)">

      &gt; cat profile.json

    </text>
    


  <!-- JSON BORDER -->

  <rect
    x="28"
    y="192"
    width="844"
    height="190"
    fill="none"
    stroke="#20a80f"
    stroke-width="1"
    opacity="0.6"/>


  <!-- JSON CONTENT -->

  
    <clipPath id="clip_opening">
      <rect
        x="55"
        y="200"
        width="0"
        height="30">

        <animate
          attributeName="width"
          from="0"
          to="35"
          begin="4.8s"
          dur="0.25s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <text
      x="55"
      y="218"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
      font-size="18"
      font-weight="normal"
      fill="#39ff14"
      clip-path="url(#clip_opening)"
      filter="url(#glow)">

      &#123;

    </text>
    

  
    <clipPath id="clip_age">
      <rect
        x="80"
        y="231"
        width="0"
        height="29">

        <animate
          attributeName="width"
          from="0"
          to="650"
          begin="5.2s"
          dur="0.75s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <text
      x="80"
      y="248"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
      font-size="17"
      font-weight="normal"
      fill="#39ff14"
      clip-path="url(#clip_age)"
      filter="url(#glow)">

      "age"        : "19 years, 10 months, 20 days"

    </text>
    

  
    <clipPath id="clip_college">
      <rect
        x="80"
        y="261"
        width="0"
        height="29">

        <animate
          attributeName="width"
          from="0"
          to="790"
          begin="6.1s"
          dur="0.9s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <text
      x="80"
      y="278"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
      font-size="17"
      font-weight="normal"
      fill="#39ff14"
      clip-path="url(#clip_college)"
      filter="url(#glow)">

      "college"    : "Bapuji Institute of Engineering and Technology"

    </text>
    

  
    <clipPath id="clip_degree">
      <rect
        x="80"
        y="291"
        width="0"
        height="29">

        <animate
          attributeName="width"
          from="0"
          to="520"
          begin="7.2s"
          dur="0.65s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <text
      x="80"
      y="308"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
      font-size="17"
      font-weight="normal"
      fill="#39ff14"
      clip-path="url(#clip_degree)"
      filter="url(#glow)">

      "degree"     : "BE Computer Science"

    </text>
    

  
    <clipPath id="clip_graduation">
      <rect
        x="80"
        y="321"
        width="0"
        height="29">

        <animate
          attributeName="width"
          from="0"
          to="300"
          begin="8.0s"
          dur="0.6s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <text
      x="80"
      y="338"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
      font-size="17"
      font-weight="normal"
      fill="#39ff14"
      clip-path="url(#clip_graduation)"
      filter="url(#glow)">

      "graduation" : 2028

    </text>
    

  
    <clipPath id="clip_closing">
      <rect
        x="55"
        y="350"
        width="0"
        height="30">

        <animate
          attributeName="width"
          from="0"
          to="35"
          begin="8.8s"
          dur="0.25s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <text
      x="55"
      y="368"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
      font-size="18"
      font-weight="normal"
      fill="#39ff14"
      clip-path="url(#clip_closing)"
      filter="url(#glow)">

      &#125;

    </text>
    


  <!-- ====================================== -->
  <!-- STATUS -->
  <!-- ====================================== -->

  
    <clipPath id="clip_status">
      <rect
        x="30"
        y="390"
        width="0"
        height="30">

        <animate
          attributeName="width"
          from="0"
          to="150"
          begin="9.5s"
          dur="0.5s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <text
      x="30"
      y="408"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
      font-size="18"
      font-weight="normal"
      fill="#39ff14"
      clip-path="url(#clip_status)"
      filter="url(#glow)">

      &gt; status

    </text>
    

  
    <clipPath id="clip_online">
      <rect
        x="155"
        y="390"
        width="0"
        height="30">

        <animate
          attributeName="width"
          from="0"
          to="180"
          begin="10.1s"
          dur="0.6s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <text
      x="155"
      y="408"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
      font-size="18"
      font-weight="normal"
      fill="#39ff14"
      clip-path="url(#clip_online)"
      filter="url(#glow)">

      [ ONLINE ]

    </text>
    

  
    <clipPath id="clip_cursor">
      <rect
        x="30"
        y="420"
        width="0"
        height="30">

        <animate
          attributeName="width"
          from="0"
          to="60"
          begin="10.9s"
          dur="0.3s"
          fill="freeze"/>

      </rect>
    </clipPath>

    <text
      x="30"
      y="438"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
      font-size="18"
      font-weight="normal"
      fill="#39ff14"
      clip-path="url(#clip_cursor)"
      filter="url(#glow)">

      &gt; _

    </text>
    

</svg>