<svg
  width="900"
  height="455"
  viewBox="0 0 900 455"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- CRT scanlines -->

    <pattern
      id="scanlines"
      width="4"
      height="4"
      patternUnits="userSpaceOnUse">

      <rect
        width="4"
        height="2"
        fill="#39ff14"
        opacity="0.035"/>

    </pattern>


    <!-- Phosphor glow -->

    <filter
      id="glow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%">

      <feGaussianBlur
        stdDeviation="2"
        result="blur"/>

      <feMerge>

        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>

      </feMerge>

    </filter>


    <!-- CRT vignette -->

    <radialGradient id="vignette">

      <stop
        offset="0%"
        stop-color="#061006"
        stop-opacity="0"/>

      <stop
        offset="70%"
        stop-color="#020502"
        stop-opacity="0.08"/>

      <stop
        offset="100%"
        stop-color="#000000"
        stop-opacity="0.7"/>

    </radialGradient>

  </defs>


  <!-- ====================================== -->
  <!-- SCREEN -->
  <!-- ====================================== -->

  <rect
    x="1"
    y="1"
    width="898"
    height="453"
    fill="#020402"
    stroke="#39ff14"
    stroke-width="1.5"/>


  <!-- Scanlines -->

  <rect
    x="1"
    y="1"
    width="898"
    height="453"
    fill="url(#scanlines)"/>


  <!-- Vignette -->

  <rect
    x="1"
    y="1"
    width="898"
    height="453"
    fill="url(#vignette)"/>


  <!-- ====================================== -->
  <!-- HEADER -->
  <!-- ====================================== -->

  
    <clipPath id="clip1">
      <rect
        x="28"
        y="17"
        width="0"
        height="25">

        <animate
          attributeName="width"
          from="0"
          to="210"
          begin="0s"
          dur="0.7s"
          fill="freeze"
          repeatCount="indefinite"/>

      </rect>
    </clipPath>

    <text
      x="28"
      y="32"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
      font-size="15"
      font-weight="normal"
      fill="#39ff14"
      clip-path="url(#clip1)"
      filter="url(#glow)">

      CHINMAY_OS v1.0

    </text>
    

  
    <clipPath id="clip2">
